<style>
:root{--night:#0e1420;--ink:#eef1ec;--mute:#9aa6b5;--lamp:#f4b740;--ease:cubic-bezier(0.22,1,0.36,1)}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--night);color:var(--ink);font:16px/24px 'Atkinson Hyperlegible',system-ui,sans-serif;padding:16px;text-align:center}
h1{font:400 48px/1 'Bungee',system-ui,sans-serif;margin:0 0 16px;background:linear-gradient(90deg,#FFFFFF,#9B9B9B);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
p{color:var(--mute);margin:0 0 32px;max-width:480px;text-wrap:pretty}
nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{display:inline-block;padding:8px 12px;border-radius:8px;font-weight:700;text-decoration:none;transition:transform .3s var(--ease)}
a:hover{transform:translateY(-2px)}a:active{transform:scale(0.98)}
a:focus-visible{outline:2px solid var(--lamp);outline-offset:4px}
.main{background:var(--lamp);color:#1b1305}.ghost{border:1px solid #2a3447;color:var(--ink)}
</style>
</head>

<main>
