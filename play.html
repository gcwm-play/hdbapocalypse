<title>HDBapocalypse</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:wght@400;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a side-on HDB block cut open like a dollhouse (left), with a tabbed control panel (right). Single night-time look by choice. */
:root{
  color-scheme:dark;
  --night:#0d141e;
  --panel:#141d29;
  --panel2:#1b2735;
  --line:#2b3a4b;
  --ink:#e8edf1;
  --mute:#8e9fb0;
  --facade:#c9d3cf;
  --facade2:#8fb1a8;
  --slab:#6f7f86;
  --lamp:#f4b740;
  --zed:#9cc35a;
  --blood:#e0533d;
  --ok:#5fc48a;
  --warn:#efa53a;
  --f-display:"Bungee","Impact","Arial Black",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button:hover:not(:disabled){border-color:var(--facade2)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 6px;max-width:100%}
.btn-main{background:var(--lamp);color:#1a1205;border-color:var(--lamp);font-weight:700}
.btn-main:hover:not(:disabled){filter:brightness(1.08);border-color:var(--lamp)}
.btn-bad{border-color:#6b2d25}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.small{font-size:12px}

#app{display:flex;flex-direction:column;height:100%}
#hud{background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.hud-time{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hud-time b{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;white-space:nowrap}
.alert-0{border-color:#3d8b5a;color:#8fe0ac}
.alert-1{border-color:#b89a2b;color:#f2d469}
.alert-2{border-color:#c57a2a;color:#f6b26b}
.alert-3{border-color:#b43a2c;color:#ff8d7a}
.alert-4{background:#000;border-color:var(--zed);color:var(--zed)}
.res-row{display:flex;flex-wrap:wrap;gap:6px 12px}
.res-row span{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.hud-next{margin-left:auto;display:flex;gap:8px;align-items:center}
.ticker{flex-basis:100%;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker b{color:var(--ink);font-weight:700}

#main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr)}
#tower-wrap{overflow-y:auto;overflow-x:hidden;position:relative;transition:background 1s}
#side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
#tabs button{border:none;border-radius:6px 6px 0 0;background:transparent;color:var(--mute);padding:7px 10px;white-space:nowrap}
#tabs button.on{background:var(--panel2);color:var(--ink)}
#panel{flex:1;overflow:auto;padding:12px 14px 28px}
@media (max-width:820px){
  .hud-date,.ticker{display:none}
  #hud{gap:4px 10px}
  .hud-time b{font-size:16px}
  #main{grid-template-columns:1fr;grid-template-rows:minmax(0,55%) minmax(0,45%)}
  #side{border-left:none;border-top:1px solid var(--line)}
}

/* ---------- the block ---------- */
/* sun / moon: radial layers on the scroll container, so they stay put while the block scrolls */
.sky-0{--fac:#3b4258;--slabc:#2a3043;--dk:#1b2030;background:radial-gradient(circle at 22% 70px,#ffe2a8 0 26px,#ffd27a55 27px,transparent 72px),linear-gradient(#5b6f9c,#c98d78 55%,#f2b47c)}
.sky-1{--fac:#4a5266;--slabc:#353c50;--dk:#232836;background:radial-gradient(circle at 58% 52px,#fff6d6 0 24px,#fff1c466 25px,transparent 74px),linear-gradient(#5fa9e0,#a9d4f0 60%,#e3f2f8)}
.sky-2{--fac:#2d3046;--slabc:#1f2234;--dk:#151826;background:radial-gradient(circle at 78% 74px,#ffd98a 0 28px,#ffd27a55 29px,transparent 82px),linear-gradient(#24183f,#6b3c55 45%,#c25a3c 80%,#f6b062)}
.sky-3{--fac:#232838;--slabc:#181c2a;--dk:#0f121b;background:radial-gradient(circle at 62% 52px,#f2efd8 0 20px,#f2efd82e 21px,transparent 62px),radial-gradient(circle at 12% 30px,#fff 0 1.2px,transparent 2px),radial-gradient(circle at 34% 64px,#fff 0 1px,transparent 2px),radial-gradient(circle at 46% 18px,#fff 0 1.2px,transparent 2px),radial-gradient(circle at 80% 28px,#fffc 0 1px,transparent 2px),radial-gradient(circle at 90% 74px,#fffa 0 1px,transparent 2px),radial-gradient(circle at 4% 80px,#fffa 0 1px,transparent 2px),radial-gradient(circle at 72% 110px,#fff9 0 1px,transparent 2px),radial-gradient(circle at 24% 140px,#fff8 0 1px,transparent 2px),linear-gradient(#08102a,#18234a 60%,#2f3a62)}
.haze #tower::after{content:"";position:absolute;inset:0;background:rgba(170,140,90,.28);pointer-events:none}
#tower{position:relative;width:min(100%,640px);margin:0 auto;padding:100px 12px 0;isolation:isolate}
.skyline{position:absolute;left:50%;bottom:0;width:max(100vw,1200px);height:auto;transform:translateX(-50%);z-index:-1;pointer-events:none}
.roof{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:0 30px 0 36px}
.blkno{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--facade);text-shadow:0 2px 0 #00000055}
.blkno small{display:block;font-size:11px;font-family:var(--f-body);color:#ffffffbb;letter-spacing:.06em;text-transform:uppercase;text-shadow:none}
.roof-stuff{display:flex;gap:6px;align-items:flex-end;font-size:18px}
.tank{display:block;flex:none}
.roofthing{display:flex;align-items:flex-end;gap:2px;font-size:11px;color:#fff;flex:none}
.roofthing svg{display:block}
.roofspr{height:40px;flex:none;margin-top:0}
.corespr{height:32px;flex:none;margin-top:0}
.corespr .sp{scale:1.1}
.vdspr{position:absolute!important;left:110px;bottom:2px;height:40px;max-width:calc(100% - 260px)}
.roof-slab{height:10px;background:var(--fac,var(--slab));margin-left:28px;border-radius:2px 2px 0 0}
.floor{display:grid;grid-template-columns:28px minmax(0,1fr) 54px minmax(0,1fr);border-bottom:6px solid var(--slabc,var(--slab));box-shadow:inset 0 -3px 0 #ffffff12;background:var(--fac,var(--facade));min-height:74px}
.lvl{font-family:var(--f-display);font-size:11px;color:#ffffffcc;display:grid;place-items:center;background:#00000033}
.floor .lvl{background:transparent;color:#ffffff73}
.floor.lost .lvl{color:var(--zed)}
.side{display:flex;gap:4px;padding:4px;min-width:0}
.unit{flex:1;min-width:0;position:relative;border-radius:3px;padding:4px 5px;background:#3a2f26;border:2px solid transparent;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;color:#fff}
.unit:hover{border-color:#ffffff66}
.unit.sel{border-color:var(--lamp)}
.unit .uid{font-family:var(--f-mono);font-size:10px;opacity:.75}
.unit .unm{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .faces{font-size:15px;line-height:1.1;display:flex;flex-wrap:wrap;gap:1px}
.unit .faces i{font-style:normal;position:relative}
.unit .faces i::after{content:"";position:absolute;right:-1px;bottom:0;width:5px;height:5px;border-radius:50%;background:var(--c,#5fc48a)}
.unit .flags{position:absolute;top:3px;right:4px;font-size:11px}
.st-known{background:#ffcf73;color:#2a1a07;box-shadow:0 0 18px #ffcf7333}
.st-known.dark{background:#3a3f55;color:#e9e4f5;box-shadow:none}
.st-known.lampon{background:#e9b866;color:#2a1a07}
.st-unknown{background:var(--dk,#141822);color:#5b6876}
.st-unknown .q{font-family:var(--f-display);font-size:18px;color:#ffffff1f}
.st-empty{background:#4b4f63;color:#e3e6ee}
.st-danger{background:#4a1a18;color:#ffb4a6;animation:thud 1.6s infinite}
.st-sealed{background:repeating-linear-gradient(45deg,#4a3526 0 8px,#36271c 8px 16px);color:#e3c7a8}
.st-lost{background:#1a2414;color:var(--zed)}
.room-workshop{background:#5d6b82;color:#fff}
.room-sickbay{background:#d8f7e3;color:#123;box-shadow:0 0 20px #7dffb055}
.room-quarantine{background:#50555c;color:#fff}
.room-depot{background:#8a6a4a;color:#fff}
.room-kopi{background:#c98a4f;color:#fff}
.st-gutted{background:#2b2a28;color:#77726a;background-image:repeating-linear-gradient(0deg,transparent 0 10px,#00000033 10px 11px)}
.room-garden{background:#3f8a4a;color:#fff;box-shadow:inset 0 -6px 0 #4fae5c}
@keyframes thud{0%,100%{transform:none}50%{transform:translateX(1px)}}
.core{background:var(--dk,#1b2030);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:#fff}
.lift{width:22px;height:30px;border:2px solid #0006;background:#6d7588;border-radius:2px;display:grid;place-items:center;font-size:9px;color:#123}
.lift.off{background:#2a2f3d;color:#888}
.barbar{width:44px;height:6px;background:#0008;border-radius:3px;overflow:hidden}
.barbar i{display:block;height:100%;background:var(--warn)}
.line-tag{font-family:var(--f-display);font-size:9px;color:#ffd27a;text-shadow:0 1px 0 #000}
.floor.lost{background:#1d2a20}
.floor.lost .core{background:#16201a}
.zz{display:inline-block;width:18px;height:26px;vertical-align:bottom;scale:1.3;transform-origin:bottom center;margin:0 3px;background-position:0 calc(var(--r) * -26px);animation:shamble 3s ease-in-out infinite,walk .9s steps(4) infinite}
@keyframes shamble{0%,100%{transform:translateX(0) rotate(-4deg)}50%{transform:translateX(5px) rotate(4deg)}}
.voiddeck{display:grid;grid-template-columns:28px minmax(0,1fr);background:var(--fac,#2d3046);min-height:84px;border-bottom:6px solid var(--slabc,#1f2234)}
.vd-in{position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:6px 10px;background:var(--dk,#151826) repeating-linear-gradient(90deg,transparent 0 22%,var(--fac,#2d3046) 22% 25%)}
.vd-in.lost{background:#2a351f}
.vd-label{font-family:var(--f-display);font-size:13px;color:#ffffff8c}
.vd-in.lost .vd-label{color:var(--zed)}
.shutter{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.shutter .barbar{width:110px;height:8px}
.ground{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:6px;padding:10px 4px 14px;background:#11151f;box-shadow:0 0 0 100vmax #11151f;clip-path:inset(0 -100vmax -100vmax)}
.site{background:#1c212d;border:1px solid #ffffff1a;border-radius:6px;padding:6px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;text-align:center}
.site b{font-size:20px;line-height:1}
.site{position:relative;cursor:pointer;transition:border-color .2s,background-color .2s}
.site:hover{border-color:#ffffff55}
.site.on{border-color:var(--lamp);background:color-mix(in srgb,var(--lamp) 18%,#1c212d);box-shadow:0 0 0 1px var(--lamp)}
.site .fox{position:absolute;top:2px;right:4px;font-size:11px}
.desthead{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:start}
.desthead .e{font-size:26px;line-height:1}
.desthead select{max-width:140px}
.site .mono{font-size:10px;opacity:.8}
.road{height:16px;background:repeating-linear-gradient(90deg,#1c212d 0 18px,#e9e2d055 18px 30px,#1c212d 30px 48px);background-size:48px 2px;background-repeat:repeat-x;background-position:0 7px;background-color:#1c212d;box-shadow:0 0 0 100vmax #1c212d;clip-path:inset(0 -100vmax)}
.horde{text-align:center;font-size:13px;padding:2px;background:#151a24;box-shadow:0 0 0 100vmax #151a24;clip-path:inset(0 -100vmax);color:var(--zed);min-height:20px}

/* ---------- panel ---------- */
h2{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0 0 6px;letter-spacing:.01em;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:16px 0 6px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.bar{height:6px;background:#0007;border-radius:3px;overflow:hidden;min-width:50px}
.bar i{display:block;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.trait{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin:1px 2px 1px 0;color:#c8d3dd}
.trait.inv{border-color:var(--lamp);color:var(--lamp)}
.pers{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:start}
.pers .big{font-size:26px;line-height:1}
.stats{display:flex;gap:4px 10px;font-family:var(--f-mono);font-size:11px;color:var(--mute);flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:500}
.meters{display:grid;grid-template-columns:52px minmax(0,1fr) 30px;gap:2px 6px;align-items:center;font-size:11px;color:var(--mute)}
.warnline{color:var(--warn);font-size:12px}
.badline{color:var(--blood);font-size:12px}
.goodline{color:var(--ok);font-size:12px}
.prow{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,128px);gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.prow2{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow2 .big2{font-size:22px;line-height:1.2}
.prow2 .nm{font-size:13px}
.prow2 select{font-size:12px;flex:1;min-width:0}
.prow2{--jc:#8e9fb0;border:none;border-left:4px solid var(--jc);background:color-mix(in srgb,var(--jc) 11%,var(--panel));border-radius:5px;padding:8px 8px 8px 8px;margin-bottom:5px}
.prow2 select[data-chg=job]{border-color:var(--jc);box-shadow:inset 3px 0 0 var(--jc)}
.jh{display:flex;align-items:center;gap:7px;color:var(--jc)}
.jh::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--jc)}
.job-guard,.jh-guard{--jc:#ec6a52}
.job-lookout,.jh-lookout{--jc:#5aa9e6}
.job-invent,.jh-invent{--jc:#f4b740}
.job-medic,.jh-medic{--jc:#4fd1c5}
.job-garden,.jh-garden{--jc:#9cc35a}
.job-rest,.jh-rest{--jc:#a3adb8}
.job-off,.jh-off{--jc:#4f5b68}
.jh-ward{--jc:#4fd1c5}
.job-run{--jc:#b48ef0}
.job-talk{--jc:#e58fd0}
.suit,button.trait{cursor:help;background:transparent;font:inherit;font-size:11px;line-height:1.5}
button.trait{padding:0 5px;border-radius:4px}
#tip{position:fixed;z-index:70;max-width:270px;background:var(--panel2);border:1px solid var(--lamp);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:0 8px 24px #000a}
#tip b{color:var(--lamp)}
.suit{font-size:11px;border:1px solid var(--jc);color:var(--jc);border-radius:4px;padding:0 5px}
.jc{color:var(--jc)}
.guide-t{background:transparent;border:none;color:var(--lamp);padding:2px 0;margin-bottom:6px;text-align:left}
.guide p{margin:0 0 8px}
.bpgroup>.card{border-left:3px solid var(--jc)}
.hist{background:#0006;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.hist-row{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.hist-row:first-of-type{border-top:none}
.hist-e{font-size:20px;line-height:1.2}
.ends{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.budget{width:100%;border-collapse:collapse;font-size:13px}
.budget th{text-align:left;font-weight:400;color:var(--mute);font-size:11px;padding:2px 6px 4px 0;white-space:nowrap}
.budget td{padding:4px 6px 2px 0;vertical-align:top;white-space:nowrap}
.budget td[colspan]{white-space:normal}
.budget tbody tr:nth-child(2n){border-bottom:1px solid var(--line)}
.prow .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow select{width:100%;font-size:12px}
.itemchips{display:flex;flex-wrap:wrap;gap:4px}
.ic{font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 9px}
.ic.on{border-color:var(--lamp);color:var(--lamp)}
.logl{font-size:13px;padding:4px 0;border-bottom:1px solid #ffffff10}
.logl .mono{color:var(--mute);font-size:11px;margin-right:6px}
.log-bad{color:#ff9c8b}.log-good{color:#9be3b4}.log-news{color:#9fb7d0}.log-big{color:var(--lamp);font-weight:700}
.routes{display:flex;flex-wrap:wrap;gap:6px}
.routes button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:120px}
.routes button small{font-size:11px;opacity:.85}
.dest{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;align-items:start;cursor:pointer;text-align:left;width:100%}
.dest.on{border-color:var(--lamp)}
.dest .e{font-size:26px;line-height:1}
.teamrow{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0}
.teamrow input{accent-color:var(--lamp)}

/* ---------- modal / title ---------- */
#modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ev{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--lamp);border-radius:10px;padding:18px 18px 16px;box-shadow:0 20px 60px #000a}
.ev.bad{border-top-color:var(--blood)}
.ev.zed{border-top-color:var(--zed)}
.ev .ico{font-size:34px;line-height:1}
.ev h2{font-size:20px;margin:8px 0}
.ev p{margin:0 0 12px;white-space:pre-line}
.ev .choices{display:flex;flex-direction:column;gap:6px}
.ev .choices button{text-align:left;padding:9px 12px}
.ev .choices small{display:block;color:var(--mute);font-size:11px}
/* ---------- ending scenes ---------- */
#modal.endm{background:#000;overflow:hidden}
.endscene{position:absolute;inset:0;width:100%;height:100%;animation:scfade 1.6s both}
.endcard{position:relative;width:min(520px,100%);max-height:100%;display:flex}
#modal.endm .ev{background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:evin .9s 1.6s both}
#modal.endm.seen .ev{animation:none}
#modal.endm.endhide .endcard{display:none}
.endshow{display:none;position:absolute;bottom:max(20px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:color-mix(in srgb,var(--panel) 85%,transparent)}
#modal.endm.endhide .endshow{display:block}
@media (min-width:1000px){#modal.endm{justify-items:end;padding-right:6vw}}
@keyframes scfade{from{opacity:0;transform:scale(1.04)}}
@keyframes evin{from{opacity:0;transform:translateY(18px)}}
.endscene *{transform-box:fill-box}
.sc-tw{animation:sctw 3s ease-in-out infinite}@keyframes sctw{50%{opacity:.2}}
.sc-fl{animation:scfl 1.7s ease-in-out infinite}@keyframes scfl{30%{opacity:.75}60%{opacity:1}80%{opacity:.85}}
.sc-ship{animation:scship 50s linear both}@keyframes scship{from{transform:translateX(-160px)}to{transform:translateX(260px)}}
.sc-bob{animation:scbob 4s ease-in-out infinite}@keyframes scbob{50%{transform:translateY(5px) rotate(.4deg)}}
.sc-shim{animation:scshim 2.4s ease-in-out infinite}@keyframes scshim{50%{opacity:.2;transform:translateX(10px)}}
.sc-flag{transform-origin:left center;animation:scflag 1.2s ease-in-out infinite}@keyframes scflag{50%{transform:skewY(4deg) scaleX(.94)}}
.sc-bird{animation:scbird 9s linear infinite}@keyframes scbird{to{transform:translate(-500px,-120px)}}
.sc-drive{animation:scdrive 14s cubic-bezier(.2,.6,.3,1) both}@keyframes scdrive{to{transform:translateX(900px)}}
.sc-rise{animation:scrise 14s ease-out both}@keyframes scrise{from{transform:translateY(140px)}}
.sc-wave{transform-origin:center;animation:scwave 3s ease-out infinite}@keyframes scwave{from{transform:scale(.3);opacity:1}to{transform:scale(6);opacity:0}}
.sc-smoke{transform-origin:center;animation:scsmoke 6s ease-out infinite}@keyframes scsmoke{from{opacity:.55;transform:translateY(0) scale(.5)}to{opacity:0;transform:translateY(-260px) scale(3)}}
.sc-march{animation:scmarch 30s linear infinite}@keyframes scmarch{from{transform:translateX(-500px)}to{transform:translateX(1700px)}}
.sc-cloud{animation:sccloud 42s linear infinite}@keyframes sccloud{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
.sc-arm{animation:scarm 3s ease-in infinite}@keyframes scarm{0%,5%{transform:rotate(0)}10%{transform:rotate(80deg)}40%,100%{transform:rotate(0)}}
.sc-spin{transform-origin:center;animation:scspin 1.4s linear infinite}@keyframes scspin{to{transform:rotate(360deg)}}
.sc-note{animation:scnote 2.8s ease-out infinite;opacity:0}@keyframes scnote{0%{opacity:0}20%{opacity:1}to{opacity:0;transform:translate(-40px,-120px)}}
.sc-drip{animation:scdrip 1.8s ease-in infinite}@keyframes scdrip{from{opacity:1}to{opacity:0;transform:translateY(60px)}}
.sc-lure{animation:sclure 40s linear infinite}@keyframes sclure{from{transform:translateX(0)}to{transform:translateX(1200px)}}
.sc-mob{animation:scmob 2.2s ease-in-out infinite}@keyframes scmob{50%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.endscene *,.endscene{animation:none!important}#modal.endm .ev{animation:none}}
#title{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at 50% 120%,#3b2b18,var(--night) 60%);overflow:auto;padding-block:max(32px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.t-inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.t-logo{font-family:var(--f-display);font-size:clamp(34px,9vw,64px);line-height:.95;color:var(--facade);text-wrap:balance}
.t-logo span{color:var(--zed)}
.t-sub{color:var(--mute);max-width:52ch}
.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.diffs{grid-template-columns:1fr}}
.diff{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px}
.diff b{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--lamp)}
.diff span{font-size:12px;color:var(--mute)}
.howto{font-size:13px;color:var(--mute);columns:2 240px;column-gap:24px}
.howto p{margin:0 0 8px;break-inside:avoid}
.howto b{color:var(--ink)}
/* resident sprites: pixel-art atlas (assets/sprites/atlas.png). 4 frames per row: idle, step, idle, step.
   Rows 0-19 residents, 20-39 the same residents infected, 40-44 zombies. Sanity dot above (::before), job ring below (::after). */
.spr{position:relative;display:block;height:42px;margin-top:auto;pointer-events:none}
.spr{container-type:inline-size}
@container (max-width:90px){.sp{scale:1.05}}
.sp,.zz{background-image:var(--atlas);background-repeat:no-repeat;background-size:72px auto;image-rendering:pixelated}
.sp{position:absolute;bottom:2px;left:var(--a);width:18px;height:26px;background-position:0 calc(var(--r) * -26px);animation:wander var(--d) ease-in-out var(--dl) infinite,walk var(--w) steps(4) var(--dlw) infinite;scale:1.45;transform-origin:bottom center}
.sp::before{content:"";position:absolute;left:7px;top:-4px;width:4px;height:4px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px #0006}
.sp::after{content:"";position:absolute;left:1px;bottom:-2px;width:16px;height:4px;border-radius:50%;background:var(--jc,transparent);opacity:.85;z-index:-1}
.sp.mad{animation:wander var(--d) linear var(--dl) infinite,walk calc(var(--w)*.5) steps(4) var(--dlw) infinite,shake .18s linear infinite}
.sp.hurt{filter:sepia(.45) saturate(1.8) hue-rotate(-28deg)}
@keyframes walk{to{background-position-x:-72px}}
@keyframes wander{0%,12%{left:var(--a)}45%,62%{left:var(--b)}95%,100%{left:var(--a)}}
@keyframes bob{50%{translate:0 -1px}}
@keyframes shake{25%{translate:-1px 0}75%{translate:1px 0}}
.sky-3 .unit .sp{animation:none;rotate:-90deg;bottom:-4px}
@media (prefers-reduced-motion:reduce){.zz,.st-danger,.sp{animation:none!important}}

function R(){let t=S.rs=(S.rs+0x6D2B79F5)>>>0;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}

function wpick(o){let tot=0;for(const k in o)tot+=o[k];let x=R()*tot;for(const k in o){x-=o[k];if(x<=0)return k}return Object.keys(o)[0]}

function mkHH(eth){
  const e=ETH[eth];const used=new Set(S.hh.map(x=>x.sur));const free=e.sur?e.sur.filter(x=>!used.has(x)):[];const h={id:S.nid++,eth,sur:e.sur?pick(free.length?free:e.sur):'',pat:pick(ETH.ml.m),unit:null,known:false,food:0,water:0,items:{},trust:ri(45,65),fate:null,kind:chance(.2)?'wary':'family',mourn:-1,hungry:0,noted:false};
  return h;
}
function nameHH(h){
  const head=members(h).find(r=>r.age>=20&&r.arch!=='helper')||members(h)[0];
  if(!head){h.name='Empty';return}
  if(h.eth==='ml'||!h.sur)h.name=(head.short)+'’s household';else h.name=h.sur+' family';
  h.name=uniqueHHName(h.name,h,head);
}
// no two households share a name: fall back to the head's name, then a number
function uniqueHHName(name,h,head){
  const taken=x=>S.hh.some(o=>o!==h&&o.name===x&&members(o).length);if(!taken(name))return name;
  const alt=head?head.short+'’s household':'';if(alt&&!taken(alt))return alt;
  for(let n=2;n<99;n++){const c=name+' ('+n+')';if(!taken(c))return c}return name;
}
// nobody in the block shares a display name: add a surname initial, then fall back to the full name, then a number
function uniqueShort(short,name,self){
  const taken=x=>S.res.some(r=>r!==self&&r.alive&&r.short===x);if(!taken(short))return short;
  const full=String(name).replace(' (you)','');const parts=full.split(' ');
  const sur=parts.length>1?(full.startsWith(short)?parts[parts.length-1]:parts[0]):'';
  const cands=[sur&&!short.includes(sur)?short+' '+sur[0]+'.':'',full!==short?full:''].filter(Boolean);
  for(const c of cands)if(!taken(c))return c;
  for(let n=2;n<99;n++){const c=short+' '+n;if(!taken(c))return c}return short;
}
function mkRes(arch,h,o){
  o=o||{};const A=ARCH[arch];const sex=o.sex||A.sex||(chance(.5)?'M':'F');const age=o.age!=null?o.age:ri(A.age[0],A.age[1]);const E=ETH[h.eth];
  let short,name;
  for(let k=0;k<12;k++){
    if(arch==='helper'){short=name=pick(HELPERS)}
    else if(arch==='worker'){short=name=pick(WORKERS)}
    else if(h.eth==='cn'){short=pick(E[sex==='M'?'m':'f']);name=h.sur+' '+short}
    else if(h.eth==='ml'){short=pick(E[sex==='M'?'m':'f']);name=short+(sex==='M'?' bin ':' binte ')+h.pat}
    else{short=pick(E[sex==='M'?'m':'f']);name=short+' '+h.sur}
    if(short!==h.pat&&!S.res.some(x=>x.hh===h.id&&x.short===short))break;
  }
  if(arch==='ahma'||arch==='ahgong'){short=E.nick[arch==='ahma'?0:1]+' '+(h.sur||short);}
  short=uniqueShort(short,name,null);
  if(arch==='you'){name=name+' (you)'}
  const st={};STK.forEach((k,i)=>st[k]=clamp(A.st[i]+ri(-1,1),1,10));
  const traits=(A.tr||[]).slice();
  if(chance(.65)){const t=pick(TRAIT_POOL);if(!traits.includes(t))traits.push(t)}
  if(age>=60&&!traits.includes('greenfinger')&&chance(.25))traits.push('greenfinger'); // the corridor-garden generation
  if(arch!=='kid'&&age>=16&&!traits.includes('inventor')&&chance(.04))traits.push('inventor');
  const r={id:S.nid++,arch,name,short,sex,age,st,traits,hp:100,san:ri(72,96),hun:0,thi:0,inf:null,job:'rest',hh:h.id,alive:true,away:false,busy:false,wpn:null,arm:null,leader:arch==='you',quar:false,lastBreak:-9};
  S.res.push(r);return r;
}

/* ================= weather / day ================= */
function rollWeather(){
  const m=curDate().getMonth();
  const w={sunny:3,hot:2,cloudy:2,rain:1,storm:1,squall:0,haze:0};
  if(m<=2||m===11){w.rain=4;w.storm=1.5;w.hot=.4;w.sunny=2}
  if(m===3||m===4||m===9||m===10){w.storm=3.5;w.hot=m<5?3:1}
  if(m>=5&&m<=8){w.squall=1.4;w.haze=1.6;w.hot=2.2}
  if(m===9)w.haze=2.4;
  const type=wpick(w);
  S.weather={type,psi:type==='haze'?ri(110,260):ri(25,70)};
}
const DIFF_P={easy:.8,normal:1,hard:1.25};
function expPressure(){const d=pday();return (3+4.5*Math.sqrt(d)+.12*d)*(DIFF_P[S.diff]||1)*(S.zMult||1)*(S.built.durian?.9:1)}
function basePressure(){return expPressure()*(0.7+R()*0.6)}

  S.hh.forEach(h=>{
    if(h.known||h.fate||!h.unit)return;const u=U(h.unit);if(!u||u.st==='lost')return;

  if(S.flags.insulinNo){const r=RS(S.flags.insulinNo);if(!r||!r.alive)S.flags.insulinNo=0;else{r.hp-=10;if(r.hp<=0){kill(r,'Went without medicine for their diabetes');S.flags.insulinNo=0}}}

  // market slowly looted by others

}

    if(u.scrapLeft<=0){u.room=null;u.st='gutted';u.gone=true;w.post=null;w.job='rest';log(u.id+' has been stripped bare: walls, pipes, even the window grilles. Nothing left. The flat is gone for good.','bad')}}}
  const gardens=rooms('garden');
  if(gardens&&S.ph===1){const tend=Math.min(gardens,jobbers('garden').length);const gmap=staffAssign('garden','garden');const gardenFood=Object.values(gmap).reduce((a,w)=>a+(w?(has(w,'greenfinger')?8:5):2),0);const water=S.grid.water||S.store.water>=gardens;if(water){if(!S.grid.water)S.store.water-=gardens;const f=gardenFood;S.store.food+=f}else log('The corridor gardens wilted today: no water to spare.','bad')}

function guardPow(r){

function doThreat(){

  queue('info',{i:'🏠',t:'Taken in',x:'The '+h.name+' make room at '+h.unit+' for the '+g.name+'. Mattresses on the floor, shared rice, too many people for one bathroom, but a door that locks.\n\nThe flat now holds '+members(h).length+' people. Above 4, everyone there loses a little sanity each phase from the crowding'+(members(h).some(r=>r.st.K>=8)?', though the host\'s Kampung spirit softens it.':'.')});
  save();render();
}
function evict(hid){
  const h=H(hid);if(!h||!h.known)return;const ms=members(h);if(!ms.length)return;
  if(ms.some(r=>r.leader)){flash('You can\'t evict your own household.');return}
  if(UI.confirmEvict!==hid){UI.confirmEvict=hid;flash('Tap Evict again to throw out the '+h.name+'. This can\'t be undone.');setTimeout(()=>{if(UI.confirmEvict===hid)UI.confirmEvict=null},4000);render();return}
  UI.confirmEvict=null;
  const vuln=ms.some(r=>r.age<13||r.age>=65);const n=ms.length;
  ms.forEach(r=>exile(r,'Evicted from the block'));h.unit=null;
  S.hh.forEach(x=>{if(x.known&&x!==h&&members(x).length)x.trust=clamp(x.trust-(vuln?20:12),0,100)});
  known().forEach(r=>r.san=clamp(r.san-(vuln?8:4)*(has(r,'bochap')?.5:1),0,100));
  log('The '+h.name+' ('+n+') were evicted from the block. Block trust is now '+blockTrust()+'%.','big');
  queue('info',{i:'🚪',t:'The '+h.name+' are gone',x:'The '+h.name+' carry their bags down the stairwell, past the barricade and out. '+(vuln?'Everyone saw the children and old folk go.':'Nobody helps them.')+'\n\n'+n+' fewer mouths to feed. Every other household trusts you less (−'+(vuln?20:12)+'), and the block is shaken.\n\nBlock trust: '+blockTrust()+'%. Below 25%, the residents may drive you out.',bad:1});
  if(blockTrust()<25&&chance(.5))queue('ousted',{});
  save();render();
}
function kill(r,cause){
  if(!r.alive)return;r.alive=false;r.job='rest';
  if(r.wpn){itemAdd(S.items,r.wpn);r.wpn=null}if(r.arm){itemAdd(S.items,r.arm);r.arm=null}if(r.tool){itemAdd(S.items,r.tool);r.tool=null}
  const h=H(r.hh);
  S.mem.unshift({name:r.name,age:r.age,arch:ARCH[r.arch].l,cause,when:stamp(S.t)+' '+PH[S.ph]});
  log(r.name+' died. '+cause+'.','bad');
  if(h&&h.known){
    members(h).forEach(m=>m.san=clamp(m.san-(has(m,'bochap')?12:25),0,100));h.mourn=S.t+3;
    known().forEach(m=>{if(m.hh!==r.hh)m.san=clamp(m.san-(has(m,'bochap')?2:4),0,100)});
  }
  handover(r);vacate(h);
  if(S.end&&!S.end.lastAsked&&!S.over&&known().length===1){S.end.lastAsked=1;queue('lastOne',{})}
}
function handover(r){if(!r.leader)return;r.leader=false;const nl=best('K',known().filter(x=>x.alive&&x.age>=16));if(nl){nl.leader=true;log(nl.name+' steps up to lead the block.','big');queue('info',{i:'⭐',t:'A new leader',x:'With '+r.name+' gone, the block turns to '+nl.name+'. You play on as them.',bad:1})}}
function vacate(h){if(h&&!members(h).length&&h.unit){const u=U(h.unit);if(u&&u.st==='known'){u.st='empty';u.hh=null;u.looted=false}}}
function exile(r,cause){
  r.alive=false;r.away=false;r.job='rest';if(r.wpn){itemAdd(S.items,r.wpn);r.wpn=null}if(r.arm){itemAdd(S.items,r.arm);r.arm=null}if(r.tool){itemAdd(S.items,r.tool);r.tool=null}
  S.mem.unshift({name:r.name,age:r.age,arch:ARCH[r.arch].l,cause,when:stamp(S.t)+' '+PH[S.ph]});log(r.name+': '+cause+'.','bad');
  handover(r);vacate(H(r.hh));

function checkOver(){
  if(S.over)return;

/* ================= expeditions ================= */
// every route the player might see for a destination; ok=false ones show as disabled buttons with a reason
const destOk=k=>k==='poly'?!!(S.end&&S.end.polyOpen):k==='far'?!!S.flags.farOpen:true;
function routes(dest){
  const fx=(S.built.fox||{})[dest]||0;const lost=S.front>0;
  return [
    {k:'gate',n:'Walk out',m:1,max:4,ok:!lost,show:true,why:'The void deck is overrun'},
    {k:'sneak',n:'Sneak down the stairs',m:+(1.5+.15*S.front).toFixed(2),max:3,ok:lost&&S.ph>=2,show:lost,why:'Only in the evening or at night'},
    {k:'rope',n:'Bedsheet rope',m:1.25,max:3,ok:lost&&!!S.built.rope&&S.front<=3,show:lost,unk:!S.built.rope,why:S.built.rope?'The line is too high up for the rope':'Build a bedsheet rope in the Workshop'},
    {k:'fox',n:fx===2?'Zipline':'Flying fox',m:fx===2?.25:.5,max:fx===2?3:2,ok:!!fx,show:dest!=='far',unk:!fx,why:'Build a flying fox in the Workshop and rig it to the '+DEST[dest].n.toLowerCase()},
  ].filter(r=>r.show);
}
function curRoute(d){const rs=routes(d).filter(r=>r.ok);return rs.find(r=>r.k===UI.route)||rs.slice().sort((a,b)=>a.m-b.m)[0]||null}
// people the block can't easily replace: warn before sending them out, and leave them off auto-picked teams
function roleWarn(r){
  const w=[];if(r.leader)w.push('your leader');
  if(has(r,'inventor')){const n=known().filter(x=>has(x,'inventor')).length;w.push(n<=1?'your only inventor':'an inventor')}
  if(r.arch==='doctor'||r.arch==='nurse')w.push('trained '+(r.arch==='doctor'?'doctor':'nurse'));
  else if(r.job==='medic')w.push('a medic');
  if(r.job==='garden')w.push('a gardener');if(r.job==='salvage')w.push('a salvager');
  return w.join(', ');
}
function runScore(r,dest){if(dest==='park')return 100-r.san;return r.st.A*2+atkOf(r)+defOf(r)*1.5+(r.arch==='driver'?2:0)+r.hp/40-(has(r,'paiseh')?2:0)-(['guard','invent','medic'].includes(r.job)?3:0)}
function runCands(){return known().filter(r=>able(r)&&r.lastRun!==S.t)}
// auto-pick the best team whenever the destination, route or phase changes; the player can still untick people
function ensureTeam(dest,rt){const key=dest+'|'+(rt?rt.k:'')+'|'+tick();if(UI.teamKey===key)return;UI.teamKey=key;if(!rt){UI.team=[];return}const max=Math.min(rt.max,4);const c=runCands().sort((a,b)=>runScore(b,dest)-runScore(a,dest));UI.team=c.filter(r=>!roleWarn(r)).concat(c.filter(r=>roleWarn(r))).slice(0,max).map(r=>r.id)}
function lookouts(){return jobbers('lookout')}
function spotOf(r){return 1+(r.tool&&TOOLS[r.tool]?TOOLS[r.tool].spot:0)}
function lookN(){return jobbers('lookout').reduce((a,r)=>a+spotOf(r),0)*(S.flags.kwatch?2:1)+(S.built.alarm?1:0)}
// provisions per person: [food, water, risk multiplier]
const PROV=[[0,0,1,'None'],[1,1,.85,'Light'],[2,2,.72,'Full']];
function expRisk(dest,route,team,lure,prov){
  if(!isOut())return 0;
  let r=DEST[dest].risk*(1+Math.sqrt(pday())*.13)*route.m*(S.zMult||1);
  const w=S.weather.type;if(w==='rain'||w==='storm')r*=.8;if(w==='haze')r*=.85;
  if(S.ph===3&&route.k!=='sneak')r*=1.3;
  r*=Math.max(.55,1-lookN()*(route.k==='sneak'?.12:.06));
  r*=Math.max(.55,1-team.reduce((a,x)=>a+atkOf(x),0)*.04);
  if(lure)r*=.6;
  if(prov)r*=PROV[prov][2];
  return clamp(r,.02,.9);
}
// average of each member's actual risk (agility and armour adjust it), as the run will roll it
function memberRisk(base,r){return clamp(base*(1-(r.st.A-5)*.05)-defOf(r)*.03,0,.95)}
function teamRisk(dest,rt,team,lure,prov){if(!isOut()||!team.length)return expRisk(dest,rt,team,lure,prov);const b=expRisk(dest,rt,team,lure,prov);return team.reduce((a,r)=>a+memberRisk(b,r),0)/team.length}
function equipTeam(){
  const team=UI.team.map(RS).filter(r=>r&&able(r));let n=0;
  ['wpn','arm'].forEach(slot=>{const val=k=>slot==='wpn'?GEAR[k].atk||0:GEAR[k].def||0;
    team.filter(r=>!r[slot]).forEach(r=>{const k=Object.keys(S.items).filter(k=>GEAR[k]&&val(k)>0).sort((a,b)=>val(b)-val(a))[0];if(k){itemAdd(S.items,k,-1);r[slot]=k;n++}})});
  flash(n?'Handed out '+n+' piece'+(n>1?'s':'')+' of gear from the store.':'Nothing left in the store to hand out.');save();render();
}
function riskLabel(r){if(r===0)return['None yet','goodline'];if(r<.08)return['Low','goodline'];if(r<.18)return['Moderate','warnline'];if(r<.3)return['High','badline'];return['Deadly','badline']}
function dispatch(dest){
  const rt=curRoute(dest);
  const team=UI.team.map(RS).filter(r=>r&&able(r)&&r.lastRun!==S.t);
  if(!rt||!team.length)return;
  if(team.length>rt.max){flash('This route takes at most '+rt.max+' people.');return}
  const lureBox=document.getElementById('uselure');const lure=!!(lureBox&&lureBox.checked&&S.built.lure>0);
  let prov=isOut()?(UI.prov||0):0;if(prov&&(S.store.food<PROV[prov][0]*team.length||S.store.water<PROV[prov][1]*team.length))prov=0;
  if(lure)S.built.lure--;if(prov){S.store.food-=PROV[prov][0]*team.length;S.store.water-=PROV[prov][1]*team.length}
  team.forEach(r=>{r.away=true;r.lastRun=S.t});
  S.exps.push({dest,route:rt.k,rm:rt.m,team:team.map(r=>r.id),back:tick()+DEST[dest].dur,lure,prov,from:S.ph});
  S.stats.runs++;
  log(team.map(r=>r.short).join(', ')+' set out for the '+DEST[dest].n.toLowerCase()+'.','');
  UI.team=[];UI.teamKey=null;UI.prov=0;save();render();
}
function resolveExps(){
  const done=S.exps.filter(e=>e.back<=tick());S.exps=S.exps.filter(e=>e.back>tick());
  done.forEach(e=>{
    if(e.wander||e.camp||e.lend){returnLoner(e);return}
    const qStart=S.queue.length; // cards raised during this run (bites, deaths) go after the run report
    const team=e.team.map(RS).filter(Boolean);const route={k:e.route,m:e.rm};
    const risk=expRisk(e.dest,route,team,e.lure,e.prov);const lines=[];const loot={food:0,water:0,meds:0,scrap:0,items:{}};
    const survivors=[];
    team.forEach(r=>{
      r.away=false;if(!r.alive)return;
      const rr=clamp(risk*(1-(r.st.A-5)*.05)-defOf(r)*.03,0,.95);const x=R();
      if(x<rr*.3){const g=[r.wpn,r.arm].filter(Boolean).map(k=>ITEMS[k].toLowerCase());r.wpn=null;r.arm=null;kill(r,'Lost on a run to the '+DEST[e.dest].n.toLowerCase());lines.push('💀 '+r.short+' did not come back.'+(g.length?' Their '+g.join(' and ')+' are gone too.':''));return}
      if(x<rr){const d=ri(15,45);r.hp-=d;if(r.hp<=0){kill(r,'Died of wounds after a supply run');lines.push('💀 '+r.short+' made it back but died of wounds.');return}
        lines.push('🩸 '+r.short+' was hurt (−'+d+' HP).');if(chance(.4-defOf(r)*.07))infect(r,'a bite from a supply run')}
      survivors.push(r);
    });
    const cap=e.route==='fox'?(((S.built.fox||{})[e.dest]===2)?.85:.6):1;
    survivors.forEach(r=>{
      if(chance(.025))itemAdd(loot.items,'bicycle');
      if(chance(.04))itemAdd(loot.items,'battery'); // pried out of an abandoned car // abandoned bikes are everywhere, if you can wheel one home
      const drv=r.arch==='driver'?1.3:1;
      if(e.dest==='far'){if(S.far==null)S.far=100;const sf=S.far/100;const f=Math.round((9+ri(0,9))*sf*drv);loot.food+=f;const w=Math.round(ri(4,9)*sf);loot.water+=w;S.far=Math.max(0,S.far-f*.3-w*.2);if(chance(.08+.3*sf))itemAdd(loot.items,pick(['battery','tape','rope','pail','clock','wire','sheets','tarp']));if(chance(.15*sf))loot.meds++}
      if(e.dest==='market'){const sf=S.market/100;const f=Math.round((6+ri(0,7))*sf*cap*drv*(isOut()?1:1.4));loot.food+=f;const w=Math.round(ri(2,6)*sf*cap);loot.water+=w;
        if(S.market<1){if(S.mktScrap==null)S.mktScrap=60;if(S.mktScrap>0&&chance(.35)){const g=Math.min(S.mktScrap,ri(3,6));S.mktScrap-=g;loot.scrap+=g}}S.market=Math.max(0,S.market-f*.4-w*.3);if(chance(.05+.25*sf))itemAdd(loot.items,pick(['battery','tape','rope','pail','clock','wire','sheets','broom']))}
      if(e.dest==='hawker'){loot.food+=Math.round(ri(3,8)*Math.max(.25,1-(S.flags.hawkerRuns||0)*.06)*cap);S.flags.hawkerRuns=(S.flags.hawkerRuns||0)+1;if(chance(.3))itemAdd(loot.items,pick(['wok','pot','knife','pail','broom']));loot.scrap+=ri(0,2)}
      if(e.dest==='park'){r.san=clamp(r.san+ri(18,30),0,100);loot.food+=ri(0,3);if(chance(.45))itemAdd(loot.items,pick(['bamboo','rope','tarp','changkol','pail','pipe','cane','slippers']))}
      if(e.dest==='school'){for(let i=0;i<ri(1,2);i++)itemAdd(loot.items,pick(['pipe','tape','rope','sheets','extinguisher','wire','pail','tarp','clock','fan','karaoke','broom','broom','binoculars']));loot.meds+=ri(0,1);loot.food+=ri(0,4);loot.scrap+=ri(1,4)}
      if(e.dest==='poly'){loot.meds+=ri(2,5);if(chance(.3))itemAdd(loot.items,pick(['sheets','tape','pail']))}
      if(e.dest==='police'){if(chance(.5))itemAdd(loot.items,'baton');if(chance(.3))itemAdd(loot.items,'riot');if(chance(.25))itemAdd(loot.items,'helmet');if(chance(.15)&&!S.items.radio&&!loot.items.radio)itemAdd(loot.items,'radio');if(chance(.2))itemAdd(loot.items,'binoculars');loot.meds+=ri(0,2);loot.scrap+=ri(0,2)}
    });
    if(e.dest==='park'&&survivors.length)lines.push('🌳 Sunlight and open sky. The team feels human again.');
    S.store.food+=loot.food;S.store.water+=loot.water;S.store.meds+=loot.meds;S.store.scrap+=loot.scrap;
    for(const k in loot.items)itemAdd(S.items,k,loot.items[k]);
    const got=[];if(loot.food)got.push(loot.food+' food');if(loot.water)got.push(loot.water+' water');if(loot.meds)got.push(loot.meds+' meds');if(loot.scrap)got.push(loot.scrap+' scrap');for(const k in loot.items)got.push(loot.items[k]+'× '+ITEMS[k]);
    if(got.length)lines.push('Brought back: '+got.join(', ')+'.');else if(survivors.length)lines.push('They came back empty-handed.');
    if(e.dest==='far'&&survivors.length&&S.far<20)lines.push(S.far<1?'The far supermarket has been picked clean too.':'The far supermarket is running low ('+Math.round(S.far)+'% left).');
    if(e.dest==='market'&&survivors.length)lines.push(S.market<1?(S.mktScrap>0?'The supermarket is stripped bare. All that\'s left to take are shelving brackets, trolleys and fridge panels for scrap.':'The supermarket is gone. Not even scrap is left.'):S.market<20?'The shelves are nearly bare now ('+Math.round(S.market)+'% left).':'');
    for(let i=lines.length-1;i>=0;i--)if(!lines[i])lines.splice(i,1);
    log('Run to the '+DEST[e.dest].n.toLowerCase()+' returned. '+(got.length?'Got '+got.join(', ')+'.':''),survivors.length===team.length?'good':'bad');
    queue('exp',{dest:e.dest,lines,bad:survivors.length<team.length});
    if(S.queue.length-1>qStart)S.queue.splice(qStart,0,S.queue.pop());
    if(e.dest==='school'&&isOut()&&survivors.length&&!S.flags.schoolSurv&&chance(.3)){S.flags.schoolSurv=1;queue('kids',{})}
    {const pc={park:.025,police:.04}[e.dest];if(pc&&isOut()&&survivors.length&&chance(pc))queue('foundSurv',{dest:e.dest,g:pick(e.dest==='park'?SURV_PARK:SURV_POLICE)})}
  });
}

function returnLoner(e){
  const r=RS(e.team[0]);if(!r||!r.alive)return;r.away=false;
  if(e.lend){
    if(chance(.85)){S.store.food+=6;r.san=clamp(r.san+5,0,100);queue('info',{i:'🤝',t:r.short+' is back',x:r.name+' crosses back from Blk '+S.flags.allyBlk+' with a sack of rice as thanks (+6 food). "Their line held. Barely."'})}
    else{r.wpn=null;r.arm=null;exile(r,'Killed defending Blk '+S.flags.allyBlk);queue('info',{i:'🤝',t:r.short+' didn\'t come back',x:'A torch message from Blk '+S.flags.allyBlk+': '+r.name+' died holding their stairwell. They send their apologies, and nothing else.',bad:1})}
    return;
  }
  if(e.camp){
    if(!isOut()||chance(.5)){itemAdd(S.items,'riot');itemAdd(S.items,'baton');S.store.meds+=3;S.store.food+=8;r.san=clamp(r.san+10,0,100);queue('info',{i:'🪖',t:r.short+' is back',x:r.name+' climbs over the barricade in torn uniform. "Camp is gone. I took what I could." He brings a riot shield, a baton, field rations and a medical pouch.'})}
    else{exile(r,'Reported for duty. Never heard from again');queue('info',{i:'🪖',t:'No word from '+r.short,x:'Weeks pass. '+r.name+' never comes back from camp.',bad:1})}
    return;
  }
  const x=R();
  if(x<.4){const f=ri(3,8);S.store.food+=f;r.san=clamp(r.san+20,0,100);queue('info',{i:'🚪',t:r.short+' came back',x:r.name+' is at the barricade, filthy and thin, with '+f+' food in their bag. "Couldn\'t find them." They come back in.'})}
  else if(x<.6){r.san=clamp(r.san+10,0,100);r.hp=Math.max(10,r.hp-20);infect(r,'a bite from outside');if(r.inf)r.inf.hidden=true;queue('info',{i:'🚪',t:r.short+' came back',x:r.name+' is back, limping, sleeve pulled down. "I\'m fine. Just fell." You let them in.'})}
  else{r.wpn=null;r.arm=null;exile(r,'Left the block and never came back');queue('info',{i:'🚪',t:'Still no sign of '+r.short,x:'Days pass. '+r.name+' never comes back.',bad:1})}
}

/* ================= inventor ================= */
function hasNeeds(rc){for(const k in rc.need)if((S.items[k]||0)<rc.need[k])return false;return true}
function recipeOpen(r){if(r.id==='zipline'&&!Object.keys(S.built.fox||{}).length)return false; // the upgrade only exists once there's a flying fox
  if(S.known[r.id])return true;if(r.secret)return false;if(r.unlock)return isOut()&&pday()>=r.unlock;return true}
function startProj(id){
  const rc=RECIPES.find(r=>r.id===id);if(!rc||S.proj||!hasNeeds(rc))return;
  if(!rooms('workshop')){flash('You need a workshop first. Repurpose an empty flat.');return}
  if(id==='booster'&&rooms('workshop')<2){flash('The booster needs two workshops.');return}
  for(const k in rc.need)itemAdd(S.items,k,-rc.need[k]);
  S.proj={id,prog:0,work:rc.work};log('The workshop starts on: '+rc.n+'.','');save();render();
}
function finishProj(){
  const rc=RECIPES.find(r=>r.id===S.proj.id);S.proj=null;let x='';
  if(GEAR[rc.id]){itemAdd(S.items,rc.id);x='Added to the communal store. Equip it from a resident\'s card.'}
  if(TOOLS[rc.id]){itemAdd(S.items,rc.id);x='Added to the communal store. Give it to a rooftop lookout from their card.'}
  if(rc.id==='sheetRope'){S.built.rope=true;x='Tied off on the floor above the line. A new way out when the stairs are lost.'}
  if(rc.id==='rainCatcher'){S.built.rain++;x='Rain now fills the store.'}
  if(rc.id==='barricadeKit'){S.built.kits++;S.bar.max+=40;S.bar.hp=S.bar.max;x='The line is rebuilt and stronger.'}
  if(rc.id==='noiseLure'){S.built.lure++;x='Use it on a run (Outside tab) or throw it on a bad night (Block tab).'}
  if(rc.id==='durianCatapult'){S.built.durian=1;x='The first volley lands. Even from the fifth floor, everyone gags. Below, the dead stagger back.'}
  if(rc.id==='karaokeDecoy'){S.built.lure+=3;x='Three nights of Hokkien oldies, ready to go. Use them from the Block tab or on a supply run.'}
  if(rc.id==='riceStill'){S.built.still=1;x='Drip, drip, drip. Clean water from dirty.'}
  if(rc.id==='kopiRig'){S.built.kopirig=1;x='The smell of real kopi-O fills the corridor. People come out of their flats just to stand near it.'}
  if(rc.id==='waterFilter'){S.built.filter=1;x='Fresh water trickles out of the filter. +3 water a day.'}
  if(rc.id==='alarmLine'){S.built.alarm=1;x='Cans rattle at every gust. Nothing gets close without everyone knowing.'}
  if(rc.id==='solarRig'){S.built.solar=1;x='The fans turn again on the hottest afternoons.'}
  if(rc.id==='lamp'){S.built.lamp++;x='Nights are less dark.'}
  if(rc.id==='flyingFox'){x='Next, choose where to rig it.'}
  if(rc.id==='booster'){S.end.radio.booster=1;x='The inventor flicks the switch. Static, then a clear carrier tone.'}
  if(rc.id==='zipline'){x='Next, choose which flying fox to upgrade.'}
  log('Workshop finished: '+rc.n+'.','good');
  queue('info',{i:'🛠️',t:rc.n+' is ready',x:rc.d+'\n\n'+x});
  // the placement choice comes after the 'ready' message
  if(rc.id==='flyingFox')queue('foxwhere',{});
  if(rc.id==='zipline')queue('zipwhere',{});

  }
  UI.expSel=[];save();render();
}

   {t:'Turn it into a community gathering'+(t?' ('+t.short+')':''),s:'Kampung spirit check. Works out well for everyone if it lands.',dis:!t,f:()=>{if(t.st.K*10+ri(0,40)>70){known().forEach(r=>r.san=clamp(r.san+6,0,100));p.san=clamp(p.san+15,0,100);return t.short+' joins the nightly gathering and turns it into a time to share stories and news. Everyone feels a little better.'}p.san=clamp(p.san-10,0,100);return 'It turns into a shouting match on the landing. Nobody feels better.'}}]})}},
 {id:'tank',w:2,once:1,c:()=>isOut()&&!S.grid.water&&S.store.water>=30,make:()=>card({i:'🚱',t:'Something in the water',x:'Residents complain the stored water smells wrong. On the roof, the cleaner finds why: a body in the open tank. It has been there a while.\n\nThe store holds '+S.store.water+' water.',bad:1,c:[
   {t:'Boil all of it',s:'−8 scrap burned as firewood. The water is safe.',dis:S.store.scrap<8,f:()=>{S.store.scrap-=8;return 'Woks over fires of broken furniture all day. It tastes of smoke, but it\'s safe.'}},
   {t:'Dump the worst of it',s:'Lose half the water',f:()=>{const l=Math.floor(S.store.water/2);S.store.water-=l;return l+' water poured down the drain.'}},
   {t:'Risk it',s:'Keep all of it. Some people may get sick.',f:()=>{const v=known().filter(()=>chance(.3));v.forEach(r=>{r.hp-=ri(15,30);if(r.hp<=0)kill(r,'Died of a gut infection from bad water')});return v.length?v.length+' residents come down with stomach cramps and fever.':'Somehow, nobody gets sick.'}}]})},
 {id:'liftshaft',w:2,once:1,c:()=>isOut()&&!S.grid.power&&S.floors>=8,make:()=>card({i:'🛗',t:'Scratching in the lift shaft',x:'With the lifts dead, residents on the top floors hear scratching and thumping inside the lift shaft. Something is climbing the cables.',zed:1,c:[
   {t:'Wire and brace every lift door shut',s:'−8 scrap',dis:S.store.scrap<8,f:()=>{S.store.scrap-=8;S.flags.liftSealed=1;return 'Every lift door is wired, braced and nailed. The scratching goes on, but nothing gets out.'}},
   {t:'It\'s probably rats',s:'Save the scrap',f:()=>{S.flags.liftOpen=1;addTimer(ri(2,4),'liftshaft',{});return 'People turn their radios up to drown it out.'}}]})},
 {id:'drop',w:1,c:()=>isOut()&&pday()>5&&lookouts().length>0&&known().filter(able).length>=2,make:()=>{
  const team=known().filter(able).sort((a,b)=>b.st.A-a.st.A).slice(0,3);
  return card({i:'🪂',t:'A supply drop',x:'The lookout on the roof shouts: a helicopter just dropped a pallet on the school field, two streets away. Other survivors will have seen it too. It\'s now or never.',c:[
   {t:'Send '+team.map(r=>r.short).join(', ')+' to grab it',s:'Your fastest people make a dangerous dash. Big reward.',f:()=>{const lines=[];let back=0;team.forEach(r=>{r.busy=true;const x=R();if(x<.12){r.wpn=null;r.arm=null;kill(r,'Killed racing for a supply drop');lines.push(r.short+' did not make it back.')}else if(x<.35){r.hp-=ri(15,35);if(r.hp<=0){kill(r,'Died of wounds after the supply drop');lines.push(r.short+' died of their wounds.')}else{lines.push(r.short+' was hurt.');if(chance(.35))infect(r,'a bite at the school field');back++}}else back++});
     if(back){const f=ri(15,25),m=ri(3,6),w=ri(10,20);S.store.food+=f;S.store.meds+=m;S.store.water+=w;lines.unshift('They got the pallet: '+f+' food, '+w+' water and '+m+' meds.')}else lines.unshift('Nobody came back with the pallet.');return lines.join('\n')}},
   {t:'Too risky. Let it go.',f:()=>'You watch strangers drag the pallet away.'}]})}},
 {id:'deserter',w:1,once:1,c:()=>isOut()&&pday()>=5&&S.front<=2,make:()=>card({i:'🎖️',t:'A soldier at the barricade',x:'A young man in a torn No. 4 uniform, with a rifle and a few magazines, asks to come in. "My unit is gone. I just need somewhere to sleep."\n\nA rifle would change everything at the line. He looks exhausted, and a little wild around the eyes.',c:[
   {t:'Let him in',s:'A strong guard with a rifle (attack 6). Gunfire draws more of them.',f:()=>{const h=newHousehold('cn');const r=mkRes('nsf',h);r.traits=['garang'];r.wpn='rifle';r.job='guard';nameHH(h);h.name='The lone soldier';addTimer(ri(5,9),'deserter',{id:r.id});return r.name+' slings his rifle and takes the night watch without being asked. Find him a flat.'}},
   {t:'Turn him away',s:'He might not take it well',f:()=>{addTimer(ri(3,6),'armedLooters',{});return 'He stares at you for a long moment, then walks off toward the expressway.'}}]})},
 {id:'insulin',w:1,once:1,c:()=>isOut()&&known().some(r=>r.age>=60&&act(r)),make:()=>{const r=pick(known().filter(x=>x.age>=60&&act(x)));return card({i:'💉',t:r.short+'\'s medicine',x:r.name+' is diabetic and has just run out of their own medicine. Without a dose each day, they will slowly get weaker.',c:[
   {t:'Give them 1 meds a day from the store',s:'Keeps them going. If the store runs dry, they decline fast.',f:()=>{S.flags.insulin=r.id;return 'Every morning, one dose from the box.'}},
   {t:'We can\'t spare it',s:'They lose health every day until the end',f:()=>{S.flags.insulinNo=r.id;members(H(r.hh)).forEach(m=>{if(m!==r)m.san=clamp(m.san-12,0,100)});return r.short+' nods slowly. "Never mind. I am old already."'}}]})}},
 {id:'strike',w:1,c:()=>isOut()&&jobbers('guard').length>=3&&known().some(r=>r.hun>30),make:()=>{const g=jobbers('guard');return card({i:'✊',t:'The guards want more',x:'The '+g.length+' guards on the line send '+g[0].short+' to speak for them. "We hold the line every night while others sleep. Double rations, or we stand down."',c:[
   {t:'Double rations for the guards',s:'−'+g.length*4+' food now',dis:S.store.food<g.length*4,f:()=>{S.store.food-=g.length*4;g.forEach(r=>{r.san=clamp(r.san+10,0,100);r.hun=0});return 'The guards eat well tonight and go back to the line in better spirits.'}},
   {t:'Rotate: guards rest, others take their shift',s:'The guards rest. Your strongest resting residents take over.',f:()=>{const sub=known().filter(r=>able(r)&&r.job==='rest'&&!g.includes(r)).sort((a,b)=>guardPow(b)-guardPow(a)).slice(0,g.length);g.forEach(r=>{r.job='rest';r.san=clamp(r.san+12,0,100)});sub.forEach(r=>r.job='guard');return 'New faces on the line tonight: '+(sub.map(r=>r.short).join(', ')||'nobody. The line is empty!')+' Check the Residents tab.'}},
   {t:'Refuse',s:'Some may walk off the line',f:()=>{const q=g.filter(()=>chance(.4));q.forEach(r=>{r.job='rest';r.san=clamp(r.san-8,0,100)});return q.length?q.map(r=>r.short).join(', ')+' walk off the line. The rest stay, grumbling.':'They grumble, but stay.'}}]})}},
 {id:'kampung',w:1,once:1,c:()=>known().some(r=>r.age>=65&&r.st.K>=6&&act(r)),make:()=>{const r=pick(known().filter(x=>x.age>=65&&x.st.K>=6&&act(x)));return card({i:'👵',t:r.short+' remembers the old days',x:'"During the Japanese time we had nothing also. We survived." '+r.name+' offers to teach the block something from the kampung days. Pick one:',c:[
   {t:'Salting and drying food',s:'Every household needs 10% less food from now on',f:()=>{S.flags.preserve=1;return 'Ikan bilis on every ledge, salted vegetables in every jar. Food goes further now.'}},
   {t:'Herbal remedies',s:'+4 meds now, and medics heal 25% faster',f:()=>{S.store.meds+=4;S.flags.herbs=1;return 'Ginger, bitter gourd leaves, pandan. Not a hospital, but it helps.'}},
   {t:'Kampung night watch',s:'Every rooftop lookout counts double for supply runs',f:()=>{S.flags.kwatch=1;return 'Whistles, tin cans on strings and a proper rota. The watch gets sharper.'}}]})}},
 {id:'kidsout',w:1,c:()=>isOut()&&known().filter(r=>r.age>=8&&r.age<=16&&act(r)).length>=2,make:()=>{const k=known().filter(r=>r.age>=8&&r.age<=16&&act(r)).slice(0,3);return card({i:'⚽',t:'The kids are missing',x:k.map(r=>r.short).join(', ')+' aren\'t in their flats. Someone saw them squeeze past the barricade an hour ago with a football. "Just to the playground," one told a friend.',bad:1,c:[
   {t:'Send your fastest adult after them',s:'Risky for whoever goes',f:()=>{const r=known().filter(x=>able(x)&&x.age>=18).sort((a,b)=>b.st.A-a.st.A)[0];if(!r)return 'Nobody is fit to go. You wait, and hope.';r.busy=true;if(chance(.75)){k.forEach(x=>x.san=clamp(x.san+10,0,100));return r.short+' drags them all back by the ears. Grounded forever.'}r.hp-=ri(15,30);if(r.hp<=0)kill(r,'Killed bringing the kids back from the playground');else if(chance(.4))infect(r,'a bite at the playground');return r.short+' got them all back, but something got hold of them first.'}},
   {t:'Wait and hope',f:()=>{const lost=k.filter(()=>chance(.3));lost.forEach(x=>{if(chance(.5))kill(x,'Killed at the playground');else infect(x,'a bite at the playground')});return lost.length?'At dusk, not all of them come back unhurt.':'At dusk they wander back, grinning. Their parents don\'t know whether to hug them or scream.'}}]})}},

 {id:'panicbuy',w:3,c:()=>!isOut()&&alertLvl()>=1,make:()=>{const b=best('A');return card({i:'🛒',t:'Panic buying',x:'Block chat: "[Forwarded many times] Rice will run out by Friday!!! Go now!!!" Photos show a queue snaking out of the supermarket.',c:[
  {t:'Send '+(b?b.short:'someone')+' to queue now',dis:!b,s:'Food for the store',f:()=>{const f=ri(9,15);S.store.food+=f;S.market=Math.max(10,S.market-8);b.busy=true;b.san=clamp(b.san-4,0,100);return b.short+' comes back two hours later, sweaty, with '+f+' food.'}},
  {t:'Calm the group chat',s:'Kampung spirit check',f:()=>{const k=best('K');if(k&&k.st.K*10+ri(0,30)>70){known().forEach(r=>r.san=clamp(r.san+4,0,100));return k.short+' posts a long, calm message. People settle down.'}known().filter(r=>has(r,'kiasu')).forEach(r=>r.san=clamp(r.san-6,0,100));return 'Nobody listens. Three more forwards arrive.'}},
  {t:'Ignore it',f:()=>'The chat scrolls on.'}]})}},
 {id:'relative',w:2,c:()=>!isOut()&&S.hh.some(h=>h.known&&h.unit),make:()=>{const h=pick(S.hh.filter(x=>x.known&&x.unit));return card({i:'🧳',t:'A cousin at the door',x:'The '+h.name+' want to take in a cousin from '+pick(ESTATES)+', whose block is already locked down. One more pair of hands, one more mouth.',c:[
  {t:'Welcome them',s:'+1 resident, they bring some food',f:()=>{addPhil(2);const r=mkRes(pick(['pmet','driver','teacher','ahbeng','nurse']),h);h.food+=4;return r.name+' ('+ARCH[r.arch].l+') moves in with a suitcase and a bag of rice.'}},
  {t:'Advise against it',s:'Family trust drops',f:()=>{h.trust=clamp(h.trust-10,0,100);members(h).forEach(m=>m.san=clamp(m.san-8,0,100));return 'They don\'t say anything, but they stop replying in the chat.'}}]})}},
 {id:'fakenews',w:2,c:()=>!isOut(),make:()=>card({i:'📱',t:'A viral forward',x:'"URGENT from a doctor friend: gargling salt water and eating raw garlic kills the virus. Share to 10 groups!"',c:[
  {t:'Debunk it in the chat',s:'Intellect check',f:()=>{const b=best('I');if(b&&b.st.I*10+ri(0,30)>70){S.hh.forEach(h=>{if(h.known)h.trust=clamp(h.trust+5,0,100)});return b.short+' posts the MOH fact check. Trust in the block goes up.'}return 'Someone replies "better safe than sorry lor". Garlic sells out.'}},
  {t:'Ignore it',f:()=>{S.store.food=Math.max(0,S.store.food-2);return 'Someone in the block eats a lot of garlic. Two food wasted on remedies.'}}]})},
 {id:'shelter',w:2,c:()=>!isOut()&&!S.flags.shelter,make:()=>card({i:'🚪',t:'Your household shelter',x:'Your flat\'s household shelter has a steel blast door. It is also full of junk: a broken standing fan, CNY decorations, a dusty treadmill, old school files.',c:[
  {t:'Clear it out',s:'Find useful items',f:()=>{S.flags.shelter=1;const got=[pick(['broom','sheets','tarp','pail']),pick(['rope','umbrella','clock','pot'])];got.forEach(k=>itemAdd(S.items,k));return 'Under the treadmill: '+got.map(k=>ITEMS[k].toLowerCase()).join(' and ')+'. Into the communal store. And a steel room that could hold someone who is sick.'}},
  {t:'Later',f:()=>'The junk can wait.'}]})},
 {id:'callup',w:3,c:()=>alertLvl()===3&&known().some(r=>act(r)&&['nsman','nsf'].includes(r.arch))&&!S.flags.callup,make:()=>{const r=known().find(x=>act(x)&&['nsman','nsf'].includes(x.arch));S.flags.callup=1;return card({i:'🪖',t:'Mobilisation SMS',x:r.name+'\'s phone buzzes: an operationally-ready recall. Report to camp within 6 hours.\n\nThe family is looking at him.',c:[
  {t:'Report to camp',s:'He leaves. Might come back with gear.',f:()=>{r.away=true;S.exps.push({dest:'camp',route:'gate',rm:1,team:[r.id],back:tick()+ri(16,40),camp:1});return r.short+' packs his field pack and leaves before dawn.'}},
  {t:'Stay with the family',s:'He stays. It weighs on him.',f:()=>{r.san=clamp(r.san-12,0,100);return r.short+' switches off his phone.'}}]})}},
 {id:'lift',w:2,c:()=>isOut()&&S.grid.power&&known().some(able),make:()=>{const r=pick(known().filter(able));const b=best('S',known().filter(x=>able(x)&&x!==r));return card({i:'🛗',t:'Stuck in the lift',x:'The power dips. The lift jams between floors with '+r.name+' inside. Something is banging on the lift doors below.',c:[
  {t:'Pry the doors open'+(b?' ('+b.short+')':''),dis:!b,s:'Strength check',f:()=>{if(b.st.S*10+ri(0,40)>65){r.san=clamp(r.san+5,0,100);return b.short+' wedges a broom handle into the gap and hauls '+r.short+' out.'}b.hp-=ri(10,20);return 'The doors snap shut on '+b.short+'\'s hand. '+r.short+' gets out an hour later when the power comes back.'}},
  {t:'Wait for the power to stabilise',f:()=>{if(chance(.6))return 'Twenty minutes later the lift jerks back to life.';r.san=clamp(r.san-25,0,100);return r.short+' spends three hours in the dark, listening to the banging.'}}]})}},
 {id:'litter',w:2,c:()=>isOut()&&S.front===0,make:()=>{const r=pick(known().filter(able).length?known().filter(able):known());return card({i:'🪴',t:'Killer litter',x:r.name+' wants to drop flower pots on the zombies clawing at the void deck shutter. "Kill them from up here lah!"',c:[
  {t:'Let them',s:'Some damage, lots of noise',f:()=>{S.bar.hp=Math.min(S.bar.max,S.bar.hp+6);S.noise+=6;r.san=clamp(r.san+8,0,100);return 'Three pots, two hits. The crowd at the shutter thins out, then the noise draws more.'}},
  {t:'Stop them',f:()=>{r.san=clamp(r.san-3,0,100);return 'The pots go back on the ledge.'}}]})}},
 {id:'chute',w:2,c:()=>isOut()&&!S.flags.chute,make:()=>card({i:'🗑️',t:'The rubbish chute',x:'The chute is jammed and the corridor stinks. Something is moving down in the bin centre.',c:[
  {t:'Clear it with a long pole',s:'−2 scrap, small risk',f:()=>{S.store.scrap=Math.max(0,S.store.scrap-2);const r=best('S');if(r&&chance(.15)){infect(r,'a scratch from something in the chute');return r.short+' clears it, but something grabbed at their arm.'}return 'Cleared. The smell fades.'}},
  {t:'Seal the hopper with tape and wood',s:'Safe, but rubbish piles up',f:()=>{S.flags.chute=1;return 'Sealed. Rubbish now goes in bags on the staircase. Everyone hates it.'}}]})},
 {id:'cat',w:1,c:()=>isOut()&&!S.flags.cat&&!S.flags.catNo,make:()=>card({i:'🐈',t:'A community cat',x:'Oyen, the ginger community cat, is mewing at the barricade. She looks thin.',c:[
  {t:'Let her in',s:'Costs 1 food a day. Everyone feels better. She hisses before zombies come.',f:()=>{S.flags.cat=1;return 'Oyen claims the shoe rack on floor '+pad(S.front+3>S.floors?S.floors:S.front+3)+'. The kids love her.'}},
  {t:'Shoo her away',f:()=>{S.flags.catNo=1;return 'She leaves. Some people don\'t talk to you for a day.'}}]})},
 {id:'kidsgate',w:1,c:()=>isOut()&&S.front===0&&!S.flags.gateKids&&pday()<25,make:()=>{S.flags.gateKids=1;return EV.kids.make()}},
 {id:'workers',w:1,c:()=>isOut()&&S.front===0&&!S.flags.workers,make:()=>{S.flags.workers=1;return card({i:'🏗️',t:'Men at the shutter',x:'Three construction workers from the dormitory down the road bang on the shutter. They have hammers and pipes, and they\'re asking for shelter.',c:[
  {t:'Let them in',s:'+3 strong residents, with tools. Some neighbours object.',f:()=>{addPhil(5);const h=newHousehold('cn');h.name='The dorm group';h.eth='cn';h.sur='';for(let i=0;i<3;i++)mkRes('worker',h);itemAdd(S.items,'hammer');itemAdd(S.items,'pipe',2);S.hh.forEach(x=>{if(x.known&&members(x).some(m=>has(m,'atas')))x.trust=clamp(x.trust-10,0,100)});return 'They come in with their tools. Find them a flat, or they sleep in the stairwell.'}},
  {t:'Turn them away',f:()=>{known().forEach(r=>r.san=clamp(r.san-5,0,100));return 'You watch them walk away down Ave 3. Nobody says anything at dinner.'}}]})}},
 {id:'aircon',w:2,c:()=>isOut()&&S.grid.power&&(S.weather.type==='hot'||S.weather.type==='sunny'),make:()=>card({i:'❄️',t:'The grid is straining',x:'The power keeps tripping. A notice from the town council asks every block to cut aircon use or risk losing power completely.',c:[
  {t:'Aircon for the elderly and babies only',s:'Grid lasts longer',f:()=>{S.failAt.power+=2;known().forEach(r=>{if(r.age>=65||r.age<8)r.san=clamp(r.san+8,0,100);else r.san=clamp(r.san-3,0,100)});return 'Most people sweat it out. The grid holds on a bit longer.'}},
  {t:'Leave it to each household',s:'Comfort now, blackout sooner',f:()=>{S.failAt.power=Math.max(pday(),S.failAt.power-2);known().forEach(r=>r.san=clamp(r.san+3,0,100));return 'Everyone stays cool. The breaker trips four times tonight.'}}]})},
 {id:'dengue',w:1,c:()=>['rain','storm'].includes(S.weather.type),make:()=>card({i:'🦟',t:'Mosquitoes',x:'Stagnant water in corridor flower pots and pails after the rain. Aedes mosquitoes are breeding.',c:[
  {t:'Everyone tips over pots and pails',s:'A free phase of work',f:()=>'Ten minutes of work saves a lot of trouble.'},
  {t:'No time for that',f:()=>{if(chance(.45)){const r=pick(known());r.hp=Math.max(5,r.hp-40);return r.short+' comes down with dengue fever. High fever, aching bones. Hopefully just dengue.'}return 'Lucky this time.'}}]})},
 {id:'haze',w:3,c:()=>S.weather.type==='haze',make:()=>card({i:'🌫️',t:'PSI '+S.weather.psi,x:'Haze from the fires across the Strait. The air smells of burning. The elderly are coughing.\n\nThe haze hides you from them too.',c:[
  {t:'Hand out medicine to the elderly',s:'−1 meds',dis:S.store.meds<1,f:()=>{S.store.meds--;return 'The coughing eases.'}},
  {t:'Tape up the windows',s:'Needs duct tape',dis:!S.items.tape,f:()=>{itemAdd(S.items,'tape',-1);return 'Every window gets taped. It is stuffy, but breathable.'}},
  {t:'Nothing to be done',f:()=>{known().filter(r=>r.age>=65).forEach(r=>r.hp=Math.max(5,r.hp-15));return 'The elderly have a hard night.'}}]})},
 {id:'looters',w:2,c:()=>isOut()&&pday()>4&&S.front<=1,make:()=>card({i:'🏍️',t:'Looters',x:'Five men on motorbikes rev at the block. "Ten food, or we light up your barricade."',c:[
  {t:'Pay them',s:'−10 food',dis:S.store.food<10,f:()=>{S.store.food-=10;return 'They take the bags and roar off. They\'ll be back.'}},
  {t:'Refuse',s:'Barricade damage, noise',f:()=>{S.bar.hp-=25;S.noise+=8;if(S.bar.hp<=0)levelFalls();return 'A bottle of petrol smashes against the barricade. The fire takes an hour to put out.'}},
  {t:'Drive them off with the guards',s:'Guard strength check',f:()=>{const g=jobbers('guard');const G=g.reduce((a,r)=>a+guardPow(r),0);if(G>12+ri(0,10)){itemAdd(S.items,pick(['parang','golf','helmet']));gangWin('the motorbike gang');return 'Your guards charge out with poles and woks. The looters flee and drop something.\n\nAs they roar off, their leader shouts back: "We\'ll be back, and next time we bring everyone!"'}g.forEach(r=>{if(chance(.4))r.hp-=ri(10,25)});S.bar.hp-=10;return 'It goes badly. Bruises, cuts, and a dented barricade.'}}]})},
 {id:'horde',w:2,c:()=>isOut()&&pday()>3&&!S.flags.horde,make:()=>{const look=lookouts().length;S.flags.horde=1;if(!look&&!S.built.alarm){log('Nobody on the roof saw the horde coming down Ave 3.','bad');return null}
  return card({i:'👁️',t:'Horde on the main road',x:'The lookout on the roof spots hundreds of them shuffling down the main road, drawn by something. They will reach the block tonight.',zed:1,c:[
  {t:'Reinforce the line now',s:'−5 scrap, +25 barricade',dis:S.store.scrap<5,f:()=>{S.store.scrap-=5;S.bar.hp=Math.min(S.bar.max+10,S.bar.hp+25);S.bar.max=Math.round(Math.max(S.bar.max,S.bar.hp));return 'Every spare plank and bicycle goes onto the barricade.'}},
  {t:'Throw a noise lure the other way',s:'Uses 1 lure',dis:!S.built.lure,f:()=>{S.built.lure--;S.flags.horde=0;return 'The alarm clock rings out two streets away. The horde turns.'}},

function maybeEvent(){
  if(S.over)return;
  if(!chance(isOut()?.32:.38))return;
  const opts=REV.filter(e=>(S.evcd[e.id]||-99)<S.t-5&&!(e.once&&S.flags['ev_'+e.id])&&e.c());if(!opts.length)return;
  const tot=opts.reduce((a,e)=>a+e.w,0);let x=R()*tot;let ev=opts[0];for(const e of opts){x-=e.w;if(x<=0){ev=e;break}}
  S.evcd[ev.id]=S.t;if(ev.once)S.flags['ev_'+ev.id]=1;queue('r:'+ev.id,{});
}
function buildCard(q){
  try{return buildCard0(q)}catch(e){console.error(e);return null}
}
function buildCard0(q){
  if(q.id==='exp'){const same=S.queue.filter(x=>x!==q&&x.id==='exp');if(same.length){q.a={multi:[q.a].concat(same.map(x=>x.a.multi||[x.a])).flat()};S.queue=S.queue.filter(x=>x===q||x.id!=='exp')}}
  if(q.id==='note'||q.id==='banging'){const same=S.queue.filter(x=>x!==q&&x.id===q.id);if(same.length){q.a={multi:[q.a].concat(same.map(x=>x.a.multi||[x.a]))};q.a.multi=q.a.multi.flat();S.queue=S.queue.filter(x=>x===q||x.id!==q.id)}}
  if(q.id.startsWith('r:')){const e=REV.find(x=>x.id===q.id.slice(2));return e?e.make():null}
  return EV[q.id]?EV[q.id].make(q.a):null;
}

/* ================= player actions ================= */
function flash(t){UI.flash=t;render();setTimeout(()=>{if(UI.flash===t){UI.flash=null;render()}},2600)}
function chat(uid){
  const u=U(uid);if(!u||u.st!=='unknown'||!S.grid.telco||S.chatUsed[uid])return;S.chatUsed[uid]=1;
  const h=u.hh?H(u.hh):null;
  if(!h||h.fate){log('No reply from '+u.id+' on the block chat.','');flash('No reply from '+u.id+'. Try again tomorrow, or knock.')}
  else if(chance(h.kind==='wary'?.3:.65)){reveal(u,'They replied on the chat.')}
  else{log('Message to '+u.id+' read, but no reply.','');flash('Seen, no reply. Try again tomorrow.')}
  save();render();
}
function knock(uid){
  const u=U(uid);const r=RS(+document.getElementById('worker').value);if(!u||!r||!able(r)||u.st!=='unknown')return;r.busy=true;
  const h=u.hh?H(u.hh):null;let msg;
  if(!h){u.st='empty';msg='Nobody home. The gate is unlocked. '+u.id+' is empty and can be searched or put to use.'}
  else if(h.fate==='dead'){u.st='empty';u.hh=null;r.san=clamp(r.san-12,0,100);msg='The smell hits first. Nobody in '+u.id+' is alive. '+r.short+' closes the door and sits on the stairs for a long time. The flat can be used now.'}
  else if(h.fate==='turned'){
    const def=defOf(r),atk=atkOf(r);
    if(chance(.45-atk*.06-def*.05)){const d=ri(15,35);r.hp-=d;u.st='danger';if(r.hp<=0){kill(r,'Attacked knocking on '+u.id);msg='The gate burst open. '+r.short+' was killed.'}else{msg='The door bursts open. What used to be the '+h.name+' grabs '+r.short+'. They get away, hurt (−'+d+' HP). '+u.id+' is marked dangerous.';if(chance(.45-def*.08))infect(r,'a bite from a neighbour')}}
    else{u.st='danger';msg='Behind the gate, groaning and scratching. '+r.short+' backs away carefully. '+u.id+' is marked dangerous.'}
  }else{
    if(h.kind==='wary'&&r.st.K*10+ri(0,30)<60){msg='"Go away! We are fine!" The '+h.name+' won\'t open up. Someone with more Kampung spirit might do better.'}
    else{reveal(u,'');msg='The '+h.name+' open the gate. '+members(h).length+' people, '+(h.food>members(h).length*3?'decently stocked':'running low on food')+'. They join the block.'}
  }
  log(r.short+' knocked on '+u.id+'. '+msg,'');
  queue('info',{i:'🚪',t:'Knocking on '+u.id,x:msg});save();render();
}
function search(uid){
  const u=U(uid);const r=RS(+document.getElementById('worker').value);if(!u||!r||!able(r)||u.st!=='empty'||u.looted)return;r.busy=true;u.looted=true;
  const f=ri(0,6),sc=ri(2,6);S.store.food+=f;S.store.scrap+=sc;const it=[];for(let i=0;i<ri(1,2);i++){const k=wpick(HH_ITEMS);itemAdd(S.items,k);it.push(ITEMS[k])}
  if(chance(.25))S.store.meds++;
  const msg=r.short+' searched '+u.id+': '+f+' food, '+sc+' scrap, '+it.join(', ')+'.';log(msg,'good');flash(msg);save();render();
}
function convert(uid){const u=U(uid);const k=document.getElementById('roomsel').value;const rm=ROOMS[k];if(!u||u.st!=='empty'||!rm||S.store.scrap<rm.cost)return;if(rooms(k)>=maxRooms(k)){flash('You already have a '+rm.n.toLowerCase()+'. A second one adds nothing.');return}S.store.scrap-=rm.cost;u.room=k;if(k==='depot'&&u.scrapLeft==null)u.scrapLeft=ri(20,35);if(k==='kopi'){const needW=(S.grid.water||S.built.kopirig)?0:2;u.open=S.store.food>=2&&S.store.water>=needW;if(u.open){S.store.food-=2;S.store.water-=needW}}log(u.id+' converted into a '+rm.n.toLowerCase()+'.','good');save();render()}
function moveIn(uid){const u=U(uid);const h=H(+document.getElementById('hhsel').value);if(!u||!h||u.st!=='empty'||u.room)return;if(h.unit){const old=U(h.unit);if(old){old.st='empty';old.hh=null;old.looted=true}}h.unit=u.id;u.hh=h.id;u.st='known';log('The '+h.name+' moved into '+u.id+'.','');save();render()}
function seal(uid){const u=U(uid);if(!u||u.st!=='danger'||S.store.scrap<5)return;S.store.scrap-=5;u.st='sealed';log(u.id+' sealed shut with planks and wire.','');save();render()}
function clearUnit(uid){
  const u=U(uid);if(!u||!(u.st==='danger'||u.st==='sealed')||u.contam)return;
  const team=known().filter(able).sort((a,b)=>guardPow(b)-guardPow(a)).slice(0,2);if(team.length<2)return;
  const T=team.reduce((a,r)=>a+guardPow(r),0);const P=6+pday()*.15;const win=chance(T/(T+P));const out=[];
  team.forEach(r=>{r.busy=true;if(chance(win?.2:.5)){const d=ri(10,30);r.hp-=d;if(r.hp<=0){kill(r,'Killed clearing '+u.id);out.push(r.short+' was killed.')}else{out.push(r.short+' was hurt.');if(chance(.35-defOf(r)*.07))infect(r,'a bite from clearing '+u.id)}}});
  if(win){u.st='empty';u.hh=null;u.looted=false;out.unshift(team.map(r=>r.short).join(' and ')+' cleared '+u.id+'. The flat is empty now.')}else out.unshift('They were driven back from '+u.id+'.');
  log(out.join(' '),win?'good':'bad');queue('info',{i:'⚔️',t:'Clearing '+u.id,x:out.join('\n'),bad:!win});save();render();
}
function donate(hid,k){
  const h=H(hid);if(!h||!h.items[k])return;const ms=members(h);
  let p=.35+h.trust/150;if(ms.some(r=>has(r,'atas')))p-=.25;if(ms.some(r=>has(r,'kiasu')))p-=.12;if(isOut())p+=.1;

function renderModal(){
  const m=$('#modal');

  if(!endKey){m.classList.remove('endm','seen','endhide');delete m.dataset.end}
  if(S.over&&!S.recorded){S.recorded=true;recordRun();save()}
  if(S.over&&S.ending){m.hidden=false;const E=ENDINGS[S.ending];const days=isOut()?pday():0;const seen=endingsSeen();
    if(endShell(m,endKey))return;m.querySelector('.endcard').innerHTML=`<div class="ev ${E.good?'':'bad'}" style="border-top-color:${E.good?'var(--ok)':'var(--blood)'}"><div class="ico">${E.i}</div><p class="small mute" style="margin:6px 0 0;text-transform:uppercase;letter-spacing:.08em">Ending · ${seen.length} of ${Object.keys(ENDINGS).length} endings found</p><h2>${esc(E.t)}</h2><p>${esc(E.x())}</p>
      <div class="kv small" style="margin-bottom:12px"><span class="mute">Days since the outbreak</span><span>${days}</span>${S.ending==='escape'?`<span class="mute">Evacuated to Changi</span><span>${S.end.evacGo||0}</span><span class="mute">Stayed behind</span><span>${S.end.evacLeft||0}</span>`:`<span class="mute">Residents alive</span><span>${known().length}</span>`}<span class="mute">Remembered</span><span>${S.mem.length}</span><span class="mute">Babies born</span><span>${S.stats.born||0}</span><span class="mute">Goodwill</span><span>${(S.end&&S.end.phil)||0}</span></div>
      <p class="small mute">Endings found: ${seen.map(k=>ENDINGS[k]?ENDINGS[k].t:k).join(', ')}.</p>
      <div class="choices">${E.good&&!E.final?'<button data-act="keepplaying">Keep playing this block</button>':''}<button data-act="endview">View the scene</button><button class="btn-main" data-act="quit">New game</button></div></div>`;return}
  if(S.over){m.hidden=false;const days=isOut()?pday():0;if(endShell(m,endKey))return;m.querySelector('.endcard').innerHTML=`<div class="ev bad"><div class="ico">🪦</div><h2>Blk ${esc(S.blk)} has fallen</h2><p>${esc(S.overWhy||'')}\n\nYou held out for ${days} day${days===1?'':'s'} after the outbreak. ${S.mem.length} people are remembered.</p><div class="stack small" style="max-height:200px;overflow:auto;margin-bottom:12px">${S.mem.map(x=>`<div>${esc(x.name)}, ${x.age}: <span class="mute">${esc(x.cause)}</span></div>`).join('')}</div><div class="choices"><button data-act="endview">View the scene</button><button class="btn-main" data-act="quit">New game</button></div></div>`;return}
  if(UI.result){m.hidden=false;m.innerHTML=`<div class="ev"><p>${esc(UI.result)}</p><div class="choices"><button class="btn-main" data-act="ok">OK</button></div></div>`;return}
  while(S.queue.length&&!CUR){const q=S.queue[0];const c=buildCard(q);if(c){CUR=c;break}S.queue.shift()}

}
function choose(i){
  const c=CUR&&CUR.c[i];if(!c||c.dis)return;
