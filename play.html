  chat:d=>chat(d.v),knock:d=>knock(d.v),search:d=>search(d.v),convert:d=>convert(d.v),movein:d=>moveIn(d.v),seal:d=>seal(d.v),clear:d=>clearUnit(d.v),
  donate:d=>donate(+d.v,d.k),askfood:d=>moveFood(+d.v,'in'),givefood:d=>moveFood(+d.v,'out'),givewater:d=>moveFood(+d.v,'out','water'),
  talk:d=>talkTo(+d.v),release:d=>{const r=RS(+d.v);if(r){r.quar=false;r.qRoom=null;checkQRooms();save();render()}},
  sealfloor:d=>{sealFloor(+d.v);save();render()},
  retakefloor:d=>{const x=retakeFloor(+d.v);queue('info',{i:'⚔️',t:'Floor '+pad(+d.v),x});save();render()},
  dispatch:d=>dispatch(d.v),
  build:d=>startProj(d.v),
  pf:d=>{UI.pf=d.v;render()},
  endview:()=>{UI.endHide=!UI.endHide;$('#modal').classList.add('seen');render()},
  keepplaying:()=>{UI.endHide=0;S.over=false;S.ending=null;S.recorded=false;save();render()},
  seallift:()=>{if(S.store.scrap<8||S.flags.liftSealed)return;S.store.scrap-=8;S.flags.liftSealed=1;log('Every lift door wired, braced and nailed shut. Nothing more is coming up the shaft.','good');flash('Lift doors sealed.');save();render()},
  prov:d=>{UI.prov=+d.v;render()},
  equipteam:()=>equipTeam(),
  askhost:d=>{const el=document.getElementById('host-'+d.v);if(el)askHost(+d.v,+el.value)},
  admit:d=>admit(+d.v),
  admitsel:()=>{const el=document.getElementById('patsel');if(el)admit(+el.value)},
  discharge:d=>{const r=RS(+d.v);if(r){leaveWard(r,' was discharged early');save();render()}},
  wardmeds:d=>{const r=RS(+d.v);if(r&&S.store.meds>0){S.store.meds--;r.hp=Math.min(100,r.hp+medsGain(r));if(r.hp>=95)leaveWard(r,' has recovered and left the sick bay');save();render()}},
  route:d=>{UI.route=d.v;UI.teamKey=null;render()},
  evict:d=>evict(+d.v),
  tip:(d,el)=>showTip(d,el),
  tend:d=>{const el=document.getElementById('worker');const r=el&&RS(+el.value);if(r){r.job='garden';r.garden=d.v;r.post=d.v;log(r.short+' now tends the garden at '+d.v+'.','');save();render()}},
  staff:d=>{const el=document.getElementById('worker');const r=el&&RS(+el.value);if(r){r.job=d.k;r.post=d.v;log(r.short+' now works at '+d.v+'.','');save();render()}},
  closeroom:d=>{const u=U(d.v);if(!u||!u.room||u.room==='quarantine')return;const n=ROOMS[u.room].n;known().forEach(r=>{if(r.post===u.id){r.post=null;r.garden=null;if(['garden','salvage'].includes(r.job))r.job='rest'}});u.room=null;u.open=false;log(n+' at '+u.id+' closed down. The flat is free to repurpose.','');save();render()},
  guide:()=>{UI.guide=!UI.guide;render()},
  armguards:()=>armGuards(),
  invwork:()=>{if(!rooms('workshop'))return;known().filter(r=>able(r)&&has(r,'inventor')).forEach(r=>r.job='invent');save();render()},
  cancelproj:()=>{if(!S.proj)return;const rc=RECIPES.find(r=>r.id===S.proj.id);for(const k in rc.need)itemAdd(S.items,k,rc.need[k]);log('Workshop project cancelled: '+rc.n+'.','');S.proj=null;save();render()},expsel:d=>{const i=UI.expSel.indexOf(d.v);if(i>=0)UI.expSel.splice(i,1);else if(UI.expSel.length<3)UI.expSel.push(d.v);render()},experiment:()=>experiment(),
  ration:d=>{S.ration=d.v;save();render()},reinforce:()=>reinforce(),lure:()=>throwLure(),retake:()=>retake(),strip:d=>strip(+d.v),
  choice:d=>choose(+d.v),ok:()=>{UI.result=null;render()},
  quit:()=>{if(!S.over&&!UI.confirmQuit){UI.confirmQuit=1;flash('Press again to abandon this block.');setTimeout(()=>UI.confirmQuit=0,3000);return}UI.confirmQuit=0;UI.endHide=0;wipe();S=null;CUR=null;UI.result=null;render()},
};
document.addEventListener('click',e=>{const tp=$('#tip');if(!tp.hidden&&!e.target.closest('[data-act=tip]'))tp.hidden=true;const b=e.target.closest('[data-act]');if(!b||b.disabled)return;if(b.tagName==='A')e.preventDefault();const f=ACT[b.dataset.act];if(f)f(b.dataset,b)});
document.getElementById('panel').addEventListener('scroll',()=>{$('#tip').hidden=true},{passive:true});
function showTip(d,el){
  const t=$('#tip');if(!t.hidden&&t.dataset.for===d.h){t.hidden=true;return}
  t.dataset.for=d.h;t.innerHTML='<b>'+esc(d.h)+'</b><br>'+esc(d.tip);t.hidden=false;
  const r=el.getBoundingClientRect();const w=Math.min(270,innerWidth-24);t.style.maxWidth=w+'px';
  t.style.left=Math.max(12,Math.min(r.left,innerWidth-w-12))+'px';
  const h=t.offsetHeight;t.style.top=(r.bottom+6+h>innerHeight-8?Math.max(8,r.top-6-h):r.bottom+6)+'px';
}
document.addEventListener('change',e=>{const el=e.target;const k=el.dataset&&el.dataset.chg;if(!k)return;const id=+el.dataset.id;
  if(k==='job')setJob(id,el.value);
  if(k==='wpn')equip(id,'wpn',el.value);
  if(k==='arm')equip(id,'arm',el.value);
  if(k==='tool')equip(id,'tool',el.value);
  if(k==='dest'){UI.dest=el.value;render();return}
  if(k==='team'){const i=UI.team.indexOf(id);if(el.checked&&i<0)UI.team.push(id);if(!el.checked&&i>=0)UI.team.splice(i,1);render()}
});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&S&&!e.target.closest('select,input,button')){e.preventDefault();if(!$('#modal').hidden){const bs=document.querySelectorAll('#modal .choices button:not(:disabled)');const all=document.querySelectorAll('#modal .choices button');if(bs[0]&&(UI.result||(CUR&&all.length===1)))bs[0].click();return}advance()}});

function migrate(){
  if(!S)return;
  {const seen=new Set();S.hh.filter(h=>members(h).length).forEach(h=>{if(seen.has(h.name)){const head=members(h).find(r=>r.age>=20&&r.arch!=='helper')||members(h)[0];h.name=uniqueHHName(h.name,h,head)}seen.add(h.name)})}
  {const seen=new Set();S.res.filter(r=>r.alive).forEach(r=>{if(seen.has(r.short))r.short=uniqueShort(r.short,r.name,r);seen.add(r.short)})}
  if(S.zMult==null&&isOut()&&pday()>31){const m=Math.floor((pday()-1)/30);S.zMult=Math.pow(1.085,m)}
  S.end=S.end||{phil:0};if(isOut()&&!S.end.docSched&&pday()<28){S.end.docSched=1;addTimer(ri(1,Math.max(1,28-pday())),'doctors',{})}
  if((S.timers||[]).some(t=>t.k==='liftshaft')&&!S.flags.liftSealed)S.flags.liftOpen=1;
  const SRCFIX={'a bite on the run':'a bite from a supply run','a bite on guard duty':'a bite from guard duty','a bite while retaking a floor':'a bite from retaking a floor'};S.res.forEach(r=>{if(r.inf&&SRCFIX[r.inf.src])r.inf.src=SRCFIX[r.inf.src]});
  if(S.built.fox===true){S.built.fox={market:1};S.known.zipline=true}else if(!S.built.fox||typeof S.built.fox!=='object')S.built.fox={};
  S.timers=S.timers||[];
  S.bar.max=Math.round(S.bar.max);
  const q0=S.units.find(u=>u.room==='quarantine'&&u.st==='empty');if(q0)S.res.forEach(r=>{if(r.alive&&r.quar&&!r.qRoom&&rooms('quarantine')){r.qRoom=q0.id;q0.qUsed=Math.min(2,(q0.qUsed||0)+1)}});
  S.res.forEach(r=>{if(r.short==='You'){const n=r.name.replace(' (you)','');const h=H(r.hh);r.short=h&&h.eth==='cn'?n.split(' ').slice(1).join(' '):n.split(' ')[0]}});
}
function start(data){
  if(data&&data.S){S=data.S;Object.assign(UI,data.UI||{});migrate()}
  render();
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S,UI}));
(window.claude&&window.claude.hot&&window.claude.hot.ready)?window.claude.hot.ready(start):start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>
