<title>HDBapocalypse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:wght@400;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a side-on HDB block cut open like a dollhouse (left), with a tabbed control panel (right). Single night-time look by choice. */
:root{
  color-scheme:dark;
  --night:#0d141e;
  --panel:#141d29;
  --panel2:#1b2735;
  --line:#2b3a4b;
  --ink:#e8edf1;
  --mute:#8e9fb0;
  --facade:#c9d3cf;
  --facade2:#8fb1a8;
  --slab:#6f7f86;
  --lamp:#f4b740;
  --zed:#9cc35a;
  --blood:#e0533d;
  --ok:#5fc48a;
  --warn:#efa53a;
  --f-display:"Bungee","Impact","Arial Black",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button:hover:not(:disabled){border-color:var(--facade2)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 6px;max-width:100%}
.btn-main{background:var(--lamp);color:#1a1205;border-color:var(--lamp);font-weight:700}
.btn-main:hover:not(:disabled){filter:brightness(1.08);border-color:var(--lamp)}
.btn-bad{border-color:#6b2d25}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.small{font-size:12px}

#app{display:flex;flex-direction:column;height:100%}
#hud{background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.hud-time{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hud-time b{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;white-space:nowrap}
.alert-0{border-color:#3d8b5a;color:#8fe0ac}
.alert-1{border-color:#b89a2b;color:#f2d469}
.alert-2{border-color:#c57a2a;color:#f6b26b}
.alert-3{border-color:#b43a2c;color:#ff8d7a}
.alert-4{background:#000;border-color:var(--zed);color:var(--zed)}
.res-row{display:flex;flex-wrap:wrap;gap:6px 12px}
.res-row span{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.hud-next{margin-left:auto;display:flex;gap:8px;align-items:center}
.ticker{flex-basis:100%;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker b{color:var(--ink);font-weight:700}

#main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr)}
#tower-wrap{overflow:auto;position:relative;transition:background 1s}
#side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
#tabs button{border:none;border-radius:6px 6px 0 0;background:transparent;color:var(--mute);padding:7px 10px;white-space:nowrap}
#tabs button.on{background:var(--panel2);color:var(--ink)}
#panel{flex:1;overflow:auto;padding:12px 14px 28px}
@media (max-width:820px){
  .hud-date,.ticker{display:none}
  #hud{gap:4px 10px}
  .hud-time b{font-size:16px}
  #main{grid-template-columns:1fr;grid-template-rows:minmax(0,55%) minmax(0,45%)}
  #side{border-left:none;border-top:1px solid var(--line)}
}

/* ---------- the block ---------- */
/* sun / moon: radial layers on the scroll container, so they stay put while the block scrolls */
.sky-0{background:radial-gradient(circle at 22% 62px,#ffd9a0 0 24px,#ffb86a55 25px 42px,transparent 43px),linear-gradient(#3a4f6e,#d39a6a 85%)}
.sky-1{background:radial-gradient(circle at 58% 44px,#fffbe6 0 22px,#fff1a866 23px 36px,#fff1a822 37px 50px,transparent 51px),linear-gradient(#3b7fc0,#9cc8e8 85%)}
.sky-2{background:radial-gradient(circle at 78% 66px,#ff9a5c 0 26px,#ff6a3d44 27px 46px,transparent 47px),linear-gradient(#2b2347,#c0604a 85%)}
.sky-3{background:radial-gradient(circle at 62% 46px,transparent 0 21px,#eef1f61c 22px 34px,transparent 35px),radial-gradient(circle at calc(62% + 8px) 41px,#06090f 0 17px,transparent 18px),radial-gradient(circle at 62% 46px,#eef1f6 0 20px,transparent 21px),radial-gradient(circle at 12% 30px,#fff 0 1.2px,transparent 2px),radial-gradient(circle at 34% 64px,#fff 0 1px,transparent 2px),radial-gradient(circle at 46% 18px,#fff 0 1.2px,transparent 2px),radial-gradient(circle at 80% 28px,#fffc 0 1px,transparent 2px),radial-gradient(circle at 90% 74px,#fffa 0 1px,transparent 2px),radial-gradient(circle at 4% 80px,#fffa 0 1px,transparent 2px),linear-gradient(#05080e,#121c2c 85%)}
.haze #tower::after{content:"";position:absolute;inset:0;background:rgba(170,140,90,.28);pointer-events:none}
#tower{position:relative;width:min(100%,640px);margin:0 auto;padding:100px 12px 0}
.roof{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:0 30px 0 36px}
.blkno{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--facade);text-shadow:0 2px 0 #00000055}
.blkno small{display:block;font-size:11px;font-family:var(--f-body);color:#ffffffbb;letter-spacing:.06em;text-transform:uppercase;text-shadow:none}
.roof-stuff{display:flex;gap:6px;align-items:flex-end;font-size:18px}
.tank{width:34px;height:24px;background:var(--slab);border-radius:3px;display:grid;place-items:center;font-size:11px;color:#fff}
.roof-slab{height:10px;background:var(--slab);margin-left:28px;border-radius:2px 2px 0 0}
.floor{display:grid;grid-template-columns:28px minmax(0,1fr) 54px minmax(0,1fr);border-bottom:6px solid var(--slab);background:var(--facade);min-height:74px}
.lvl{font-family:var(--f-display);font-size:11px;color:#ffffffcc;display:grid;place-items:center;background:#00000033}
.floor .lvl{background:transparent;color:#4b5a5e}
.floor.lost .lvl{color:var(--zed)}
.side{display:flex;gap:4px;padding:4px;min-width:0}
.unit{flex:1;min-width:0;position:relative;border-radius:3px;padding:4px 5px;background:#3a2f26;border:2px solid transparent;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;color:#fff}
.unit:hover{border-color:#ffffff66}
.unit.sel{border-color:var(--lamp)}
.unit .uid{font-family:var(--f-mono);font-size:10px;opacity:.75}
.unit .unm{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .faces{font-size:15px;line-height:1.1;display:flex;flex-wrap:wrap;gap:1px}
.unit .faces i{font-style:normal;position:relative}
.unit .faces i::after{content:"";position:absolute;right:-1px;bottom:0;width:5px;height:5px;border-radius:50%;background:var(--c,#5fc48a)}
.unit .flags{position:absolute;top:3px;right:4px;font-size:11px}
.st-known{background:linear-gradient(#f6d58c,#d9a659);color:#2a1a07}
.st-known.dark{background:linear-gradient(#4d4a5c,#36323f);color:#e9e4f5}
.st-known.lampon{background:linear-gradient(#e9c98a,#b48a4f);color:#2a1a07}
.st-unknown{background:#07090c;color:#5b6876}
.st-unknown .q{font-family:var(--f-display);font-size:18px;color:#2a3440}
.st-empty{background:#5b5249;color:#efe6da}
.st-danger{background:#3b1714;color:#ffb4a6;animation:thud 1.6s infinite}
.st-sealed{background:repeating-linear-gradient(45deg,#3d2c22 0 8px,#2a1e17 8px 16px);color:#e3c7a8}
.st-lost{background:#1a2414;color:var(--zed)}
.room-workshop{background:linear-gradient(#7b8c9a,#4f5d69);color:#fff}
.room-sickbay{background:linear-gradient(#e8f1f0,#a9c9c6);color:#123}
.room-quarantine{background:linear-gradient(#6d7175,#3c3f43);color:#fff}
.room-garden{background:linear-gradient(#7cbc6b,#3f7a3a);color:#fff}
@keyframes thud{0%,100%{transform:none}50%{transform:translateX(1px)}}
.core{background:repeating-linear-gradient(-35deg,#55626a 0 6px,#47535a 6px 12px);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:#fff}
.lift{width:22px;height:30px;border:2px solid #222b;background:#8d989e;border-radius:2px;display:grid;place-items:center;font-size:9px;color:#123}
.lift.off{background:#30383d;color:#888}
.barbar{width:44px;height:6px;background:#0008;border-radius:3px;overflow:hidden}
.barbar i{display:block;height:100%;background:var(--warn)}
.line-tag{font-family:var(--f-display);font-size:9px;color:#ffd27a;text-shadow:0 1px 0 #000}
.floor.lost{background:#28331f}
.floor.lost .core{background:repeating-linear-gradient(-35deg,#3a4630 0 6px,#2d3825 6px 12px)}
.zz{font-size:15px;display:inline-block;animation:shamble 3s ease-in-out infinite}
@keyframes shamble{0%,100%{transform:translateX(0) rotate(-4deg)}50%{transform:translateX(5px) rotate(4deg)}}
.voiddeck{display:grid;grid-template-columns:28px minmax(0,1fr);background:#b9c2bd;min-height:84px;border-bottom:6px solid #4a5357}
.vd-in{position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:6px 10px;background:repeating-linear-gradient(90deg,transparent 0 22%,#9aa5a0 22% 24%)}
.vd-in.lost{background:#2a351f}
.vd-label{font-family:var(--f-display);font-size:13px;color:#33413d}
.vd-in.lost .vd-label{color:var(--zed)}
.shutter{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.shutter .barbar{width:110px;height:8px}
.ground{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:10px 4px 14px;background:linear-gradient(#3b4a3a,#2a3529)}
.site{background:#00000044;border:1px solid #ffffff22;border-radius:6px;padding:6px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;text-align:center}
.site b{font-size:20px;line-height:1}
.site .mono{font-size:10px;opacity:.8}
.road{height:16px;background:repeating-linear-gradient(90deg,#3a3f44 0 18px,#e6e6e6 18px 30px,#3a3f44 30px 48px);background-size:48px 2px;background-repeat:repeat-x;background-position:0 7px;background-color:#3a3f44}
.horde{text-align:center;font-size:13px;padding:2px;background:#3a3f44;color:var(--zed);min-height:20px}

/* ---------- panel ---------- */
h2{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0 0 6px;letter-spacing:.01em;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:16px 0 6px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.bar{height:6px;background:#0007;border-radius:3px;overflow:hidden;min-width:50px}
.bar i{display:block;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.trait{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin:1px 2px 1px 0;color:#c8d3dd}
.trait.inv{border-color:var(--lamp);color:var(--lamp)}
.pers{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:start}
.pers .big{font-size:26px;line-height:1}
.stats{display:flex;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--mute);flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:500}
.meters{display:grid;grid-template-columns:52px minmax(0,1fr) 30px;gap:2px 6px;align-items:center;font-size:11px;color:var(--mute)}
.warnline{color:var(--warn);font-size:12px}
.badline{color:var(--blood);font-size:12px}
.goodline{color:var(--ok);font-size:12px}
.prow{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,128px);gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.prow2{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow2 .big2{font-size:22px;line-height:1.2}
.prow2 .nm{font-size:13px}
.prow2 select{font-size:12px;flex:1;min-width:0}
.prow2{--jc:#8e9fb0;border:none;border-left:4px solid var(--jc);background:color-mix(in srgb,var(--jc) 11%,var(--panel));border-radius:5px;padding:8px 8px 8px 8px;margin-bottom:5px}
.prow2 select[data-chg=job]{border-color:var(--jc);box-shadow:inset 3px 0 0 var(--jc)}
.jh{display:flex;align-items:center;gap:7px;color:var(--jc)}
.jh::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--jc)}
.job-guard,.jh-guard{--jc:#ec6a52}
.job-lookout,.jh-lookout{--jc:#5aa9e6}
.job-invent,.jh-invent{--jc:#f4b740}
.job-medic,.jh-medic{--jc:#4fd1c5}
.job-garden,.jh-garden{--jc:#9cc35a}
.job-rest,.jh-rest{--jc:#a3adb8}
.job-off,.jh-off{--jc:#4f5b68}
.prow .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow select{width:100%;font-size:12px}
.itemchips{display:flex;flex-wrap:wrap;gap:4px}
.ic{font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 9px}
.ic.on{border-color:var(--lamp);color:var(--lamp)}
.logl{font-size:13px;padding:4px 0;border-bottom:1px solid #ffffff10}
.logl .mono{color:var(--mute);font-size:11px;margin-right:6px}
.log-bad{color:#ff9c8b}.log-good{color:#9be3b4}.log-news{color:#9fb7d0}.log-big{color:var(--lamp);font-weight:700}
.dest{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;align-items:start;cursor:pointer;text-align:left;width:100%}
.dest.on{border-color:var(--lamp)}
.dest .e{font-size:26px;line-height:1}
.teamrow{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0}
.teamrow input{accent-color:var(--lamp)}

/* ---------- modal / title ---------- */
#modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ev{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--lamp);border-radius:10px;padding:18px 18px 16px;box-shadow:0 20px 60px #000a}
.ev.bad{border-top-color:var(--blood)}
.ev.zed{border-top-color:var(--zed)}
.ev .ico{font-size:34px;line-height:1}
.ev h2{font-size:20px;margin:8px 0}
.ev p{margin:0 0 12px;white-space:pre-line}
.ev .choices{display:flex;flex-direction:column;gap:6px}
.ev .choices button{text-align:left;padding:9px 12px}
.ev .choices small{display:block;color:var(--mute);font-size:11px}
#title{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at 50% 120%,#3b2b18,var(--night) 60%);overflow:auto;padding-block:max(32px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.t-inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.t-logo{font-family:var(--f-display);font-size:clamp(34px,9vw,64px);line-height:.95;color:var(--facade);text-wrap:balance}
.t-logo span{color:var(--zed)}
.t-sub{color:var(--mute);max-width:52ch}
.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.diffs{grid-template-columns:1fr}}
.diff{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px}
.diff b{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--lamp)}
.diff span{font-size:12px;color:var(--mute)}
.howto{font-size:13px;color:var(--mute);columns:2 240px;column-gap:24px}
.howto p{margin:0 0 8px;break-inside:avoid}
.howto b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.zz,.st-danger{animation:none}}
</style>

<div id="app">
  <header id="hud"></header>
  <main id="main">
    <section id="tower-wrap"><div id="tower"></div></section>
    <aside id="side"><nav id="tabs"></nav><div id="panel"></div></aside>
  </main>
</div>
<div id="modal" hidden></div>
<div id="title"></div>

/* ================= weather / day ================= */
function rollWeather(){
  const m=curDate().getMonth();
  const w={sunny:3,hot:2,cloudy:2,rain:1,storm:1,squall:0,haze:0};
  if(m<=2||m===11){w.rain=4;w.storm=1.5;w.hot=.4;w.sunny=2}
  if(m===3||m===4||m===9||m===10){w.storm=3.5;w.hot=m<5?3:1}
  if(m>=5&&m<=8){w.squall=1.4;w.haze=1.6;w.hot=2.2}
  if(m===9)w.haze=2.4;
  const type=wpick(w);
  S.weather={type,psi:type==='haze'?ri(110,260):ri(25,70)};
}
function basePressure(){const d=pday();return (2+3.2*Math.sqrt(d))*(0.75+R()*0.5)}
function newDay(){
  S.talks=2+(known().some(r=>act(r)&&r.arch==='rcauntie')?1:0);S.chatUsed={};
  rollWeather();
  const w=S.weather.type;
  if((w==='rain'||w==='storm'||w==='squall')&&S.built.rain>0){const g=S.built.rain*(w==='storm'?14:9);S.store.water+=g;log('Rain catchers collected '+g+' water.','good')}
  if(S.t===S.outbreakAt){outbreak();return}
  if(!isOut()){
    S.market=Math.max(15,S.market-ri(2,4)*(alertLvl()+1));
    S.news=pick(NEWS[alertLvl()]);log(S.news,'news');
    return;
  }
  const d=pday();
  // infrastructure
  ['telco','power','water'].forEach(k=>{if(S.grid[k]&&d>=S.failAt[k]){S.grid[k]=false;gridFail(k)}});
  // consumption
  consume();
  // unknown households
  S.hh.forEach(h=>{
    if(h.known||h.fate||!h.unit)return;const u=U(h.unit);if(!u||u.st==='lost')return;
    h.food=Math.max(0,h.food-members(h).length);
    if(h.food<=0){h.hungry++;if(!h.noted&&!S.grid.telco&&chance(.35)){h.noted=true;queue('note',{h:h.id})}}
    if(h.hungry>7&&chance(.3)){h.fate='dead'}
    else if(chance(Math.min(.07,.01+.0015*d))){h.fate='turned';if(chance(.6))queue('banging',{u:u.id})}
  });
  // breakouts from known dangerous flats
  S.units.forEach(u=>{if(u.st==='danger'&&u.lvl>S.front){u.breakout++;if(u.breakout>=3&&chance(.3))breakout(u)}});
  if(S.flags.cat&&S.store.food>0)S.store.food--;
  // market slowly looted by others
  S.market=Math.max(0,S.market-ri(0,2));
  const dt=curDate();
  if(dt.getMonth()===7&&dt.getDate()===9)queue('natday',{});
  if(dt.getMonth()===1&&dt.getDate()===15)queue('tdd',{});
  S.news=pick(['Radio: static.','Radio: "...remain indoors. Do not approach the infected..."','Block chat: silent.','Smoke over '+pick(ESTATES)+'.','A helicopter passes, far away.','Car alarms all night on Ave 3.']);
  if(d%10===0)log('Day '+d+'. The block is still standing.','big');
}

function consume(){
  const ration=S.ration;
  S.hh.forEach(h=>{
    if(!h.known)return;const ms=members(h);if(!ms.length)return;
    const hawk=ms.some(r=>r.arch==='hawker'&&act(r))?.85:1;
    const needF=Math.ceil(ms.length*hawk);let got=Math.min(h.food,needF);h.food-=got;
    let short=needF-got;if(short>0){const give=ration==='full'?short:ration==='half'?Math.ceil(short/2):0;const g=Math.min(give,S.store.food);S.store.food-=g;got+=g}

    if(!S.grid.water){const needW=ms.length;let gw=Math.min(h.water,needW);h.water-=gw;let sw=needW-gw;if(sw>0){const give=ration==='full'?sw:ration==='half'?Math.ceil(sw/2):0;const g=Math.min(give,S.store.water);S.store.water-=g;gw+=g}fW=clamp(gw/needW,0,1)}
    ms.forEach(r=>{
      r.hun=clamp(r.hun+35*(1-fF)-40*fF,0,100);r.thi=clamp(r.thi+50*(1-fW)-50*fW,0,100);
      if(r.hun>=70){r.hp-=r.hun>=100?22:10}
      if(r.thi>=70){r.hp-=r.thi>=100?30:15}
      if(r.hp<=0)kill(r,r.thi>=70?'Dehydration':'Starvation');
    });
    if(fF<1)log(h.name+' went '+(fF===0?'without food':'on short rations')+'.','bad');
    if(fW<1)log(h.name+' did not have enough water.','bad');
  });
}

/* ================= phase loop ================= */
function advance(){
  if(!S||S.over||S.queue.length)return;
  doJobs();
  if(isOut())doThreat();
  doInfection();
  doSanity();
  S.ph++;
  S.res.forEach(r=>r.busy=false);
  if(S.ph>3){S.ph=0;S.t++;newDay()}
  resolveExps();
  maybeEvent();
  S.noise=Math.max(0,S.noise*.5-.5);
  checkOver();
  save();render();
}
function doJobs(){
  const ks=known();
  // rest
  ks.forEach(r=>{if(!act(r))return;if(r.job==='rest'&&r.hun<60&&r.thi<60)r.hp=Math.min(100,r.hp+3)});
  // medic
  const medics=jobbers('medic');const sb=rooms('sickbay')>0;
  medics.forEach(m=>{
    const amt=(3+m.st.I*.7+(m.arch==='nurse'?3:0))*(sb?2:1);
    ks.filter(r=>r.hp<100).sort((a,b)=>a.hp-b.hp).slice(0,2).forEach(r=>r.hp=Math.min(100,r.hp+amt));
    ks.forEach(r=>{if(r.inf&&r.inf.hidden&&chance(.04*m.st.I/5+(sb?.1:0)+(m.arch==='nurse'?.06:0))){r.inf.hidden=false;log(m.short+' found a bite '+r.short+' was hiding.','bad');queue('infected',{id:r.id})}});
  });
  // inventor
  if(S.proj){
    const inv=jobbers('invent').filter(r=>has(r,'inventor'));const helpers=jobbers('invent').filter(r=>!has(r,'inventor'));
    if(inv.length){
      let p=inv.reduce((a,r)=>a+2+r.st.I*.3,0)+helpers.length*.8;if(rooms('workshop'))p*=1.5;
      if(inv.some(r=>has(r,'sian'))&&chance(.25))p*=.3;
      S.proj.prog+=p;
      if(S.proj.prog>=S.proj.work)finishProj();
    }
  }
  // garden
  const gardens=rooms('garden');
  if(gardens&&S.ph===1){const tend=jobbers('garden').length;const water=S.grid.water||S.store.water>=gardens;if(water){if(!S.grid.water)S.store.water-=gardens;const f=gardens*(tend?5:2);S.store.food+=f}}
  // sian skip
  ks.forEach(r=>{if(act(r)&&has(r,'sian')&&r.job!=='rest'&&chance(.05)){log(r.short+' couldn\'t be bothered today. Sian.','');r.busy=true}});
}
function guardPow(r){
  let p=2.5+r.st.S*.5+atkOf(r)*1.6+(has(r,'garang')?2:0)+(['nsman','nsf','worker'].includes(r.arch)?2:0);
  p*=(.5+r.hp/200);if(r.san<25)p*=.6;if(r.age>=70)p*=.4;return p;
}
function doThreat(){
  const f=[.25,.2,.5,1][S.ph];
  let p=basePressure()*f+S.noise*f;
  if(S.ph===3){
    if(S.flags.horde){p*=2.2;S.flags.horde=false;log('The horde hit the line tonight.','bad')}
    if(S.flags.lure){p*=.5;S.flags.lure=false;log('The noise lure pulled them away for a while.','good')}
  }
  if(S.weather.type==='rain'||S.weather.type==='storm')p*=.85;
  const guards=jobbers('guard');
  const G=guards.reduce((a,r)=>a+guardPow(r),0)*(S.front>0?1.25:1);
  const dmg=Math.max(0,p-G)*2.2;
  const rep=guards.reduce((a,r)=>a+1+r.st.S*.2+(r.arch==='worker'?1.5:0)+(r.arch==='cleaner'?1:0),0);
  S.bar.hp=clamp(S.bar.hp+rep-dmg,-1,S.bar.max);
  if(p>1.5)guards.forEach(g=>{
    const c=clamp(.015+.12*(p/(G+3))-defOf(g)*.02,.003,.5);
    if(chance(c)){
      const d=ri(15,35);g.hp-=d;
      if(g.hp<=0){kill(g,'Killed holding the line');return}
      log(g.short+' was hurt on guard duty (−'+d+' HP).','bad');
      if(chance(.32-defOf(g)*.06))infect(g,'a bite on guard duty');
    }
  });
  if(S.ph===3&&dmg>0)log('Night attack on the '+(S.front===0?'void deck':'floor '+pad(S.front+1)+' stairwell')+'. Barricade took '+Math.round(dmg)+' damage.','bad');
  if(S.bar.hp<=0)levelFalls();
}
function levelFalls(){
  const lvl=S.front+1;S.front++;
  const txt=[];
  if(lvl===1){txt.push('The void deck shutter has given way. The dead are inside the ground floor. The line moves to the floor 02 stairwell.')}
  else txt.push('Floor '+pad(lvl)+' has been overrun.');
  S.units.filter(u=>u.lvl===lvl).forEach(u=>{
    const h=u.hh?H(u.hh):null;
    if(h&&h.known){
      members(h).forEach(r=>{if(r.away)return;const x=R();if(x<.22){kill(r,'Caught when floor '+pad(lvl)+' fell')}else if(x<.42){r.hp-=ri(15,40);if(r.hp<=0)kill(r,'Caught when floor '+pad(lvl)+' fell');else infect(r,'a bite in the retreat')}});
      h.unit=null;txt.push(h.name+' fled upstairs and are sleeping in the stairwell.');
    }else if(h){h.fate='lost'}
    if(u.room)txt.push('The '+ROOMS[u.room].n.toLowerCase()+' on '+u.id+' is gone.');
    u.st='lost';u.room=null;
  });
  jobbers('guard').forEach(g=>{if(chance(.2)){g.hp-=ri(10,30);if(g.hp<=0)kill(g,'Killed in the retreat');else if(chance(.25))infect(g,'a bite in the retreat')}});
  S.bar={hp:40+S.built.kits*15,max:60+S.built.kits*40};
  log(txt[0],'big');
  if(S.front>=S.floors){S.over=true;S.overWhy='The dead reached the roof.';return}
  queue('fall',{x:txt.join('\n\n')});
}
function breakout(u){
  u.breakout=0;
  const vic=S.units.filter(v=>v.lvl===u.lvl&&v.hh&&H(v.hh).known).flatMap(v=>members(H(v.hh))).filter(r=>!r.away);
  vic.forEach(r=>{if(chance(.18)){r.hp-=ri(15,35);if(r.hp<=0)kill(r,'Attacked when '+u.id+' broke open');else if(chance(.35))infect(r,'a bite in the corridor')}});
  S.noise+=6;
  log('The dead in '+u.id+' broke through the door into the corridor.','bad');
  queue('info',{i:'🚪',t:u.id+' broke open',x:'What was inside '+u.id+' has smashed through the gate and into the floor '+pad(u.lvl)+' corridor. Neighbours fought it off, but not cleanly. Seal or clear dangerous flats before this happens.',bad:1});
}
function infect(r,src){
  if(r.inf||!r.alive)return;
  const hidden=has(r,'paiseh')?chance(.85):chance(.3);
  r.inf={src,turn:tick()+ri(3,9),hidden,limb:chance(.55)};
  if(!hidden)queue('infected',{id:r.id});
  else{
    const h=H(r.hh);const kp=members(h).find(m=>m!==r&&has(m,'kaypoh'));
    if(kp&&chance(.5)){r.inf.hidden=false;log(kp.short+' noticed '+r.short+' hiding a bandage. Kaypoh pays off.','bad');queue('infected',{id:r.id})}
  }
}
function doInfection(){
  known().forEach(r=>{
    if(!r.inf||r.away)return;
    if(r.inf.hidden&&r.inf.turn-tick()<=1&&chance(.5)){r.inf.hidden=false;log(r.short+' is burning with fever. There is a bite under the sleeve.','bad');queue('infected',{id:r.id})}
    if(tick()>=r.inf.turn)turn(r);
  });
}
function turn(r){
  const h=H(r.hh);
  if(r.quar){kill(r,'Turned in quarantine');S.noise+=2;queue('info',{i:'🔒',t:r.short+' has turned',x:'Behind the steel door of the shelter, '+r.name+' stopped answering. Then the scratching started.\n\nThe quarantine held. Nobody else was hurt.',bad:1});return}
  const vic=members(h).filter(m=>m!==r&&!m.away);const hurt=[];
  vic.forEach(m=>{if(chance(.45)){m.hp-=ri(20,45);if(m.hp<=0){kill(m,'Attacked by '+r.short+' after they turned');hurt.push(m.short+' was killed')}else{hurt.push(m.short+' was hurt');if(chance(.4))infect(m,'a bite from '+r.short)}}});
  kill(r,'Turned');S.noise+=6;
  queue('info',{i:'🧟',t:r.short+' turned at home',x:r.name+' turned inside the '+h.name+' flat.\n\n'+(hurt.length?hurt.join('. ')+'.':'The family got out of the way in time.')+'\n\nNeighbours dragged the body out to the rubbish chute room.',bad:1,zed:1});
}
function sanDelta(r){
  let d=isOut()?-.9:-.15;const h=H(r.hh);const u=unitOf(r);
  if(r.hun>50)d-=1.2;if(r.thi>50)d-=1.6;if(r.hp<50)d-=.8;
  if(isOut()&&u&&u.lvl-S.front<=2)d-=.7;
  if(!u)d-=2;
  if(!S.grid.power){if((S.weather.type==='hot'||S.weather.type==='sunny')&&S.ph===1)d-=1.3;if(S.ph>=2&&!S.built.lamp)d-=.6}
  if(S.weather.type==='haze')d-=.7;if(S.weather.type==='rain'||S.weather.type==='storm')d+=.2;
  if(r.job==='guard'&&!has(r,'garang'))d-=.8;
  if(r.job==='rest')d+=1.2;
  if(S.flags.cat)d+=.3;if(S.flags.chute)d-=.3;
  if(h.mourn>S.t)d-=1.2;
  if(members(h).some(m=>m!==r&&m.quar))d-=.8;
  if(members(h).some(m=>m!==r&&m.st.K>=8&&!m.away))d+=.4;
  if(members(h).some(m=>m!==r&&m.arch==='helper'))d+=.2;
  if(has(r,'kiasu')&&S.store.food<known().length*2&&isOut())d-=.8;
  if(has(r,'pantang')&&S.ph===3)d-=.5;
  if(d<0){if(has(r,'bochap'))d*=.6;if(has(r,'steady'))d*=.8}
  return d;
}
function doSanity(){
  known().forEach(r=>{
    if(r.away)return;r.san=clamp(r.san+sanDelta(r),0,100);
    if(r.san<25&&S.t-r.lastBreak>=2&&r.age>=13&&!r.quar&&chance((25-r.san)/25*.16+.01)){r.lastBreak=S.t;queue('breakdown',{id:r.id,k:breakKind(r)})}
  });
}
function breakKind(r){
  const h=H(r.hh);const o={sneak:3,scream:2,refuse:2,steal:has(r,'kiasu')?3:1};
  if(members(h).filter(m=>m!==r&&!m.away).length&&r.age>=16)o.harm=2;

}
function kill(r,cause){
  if(!r.alive)return;r.alive=false;r.job='rest';
  if(r.wpn){itemAdd(S.items,r.wpn);r.wpn=null}if(r.arm){itemAdd(S.items,r.arm);r.arm=null}
  const h=H(r.hh);
  S.mem.unshift({name:r.name,age:r.age,arch:ARCH[r.arch].l,cause,when:stamp(S.t)+' '+PH[S.ph]});

  if(h&&h.known){

    known().forEach(m=>{if(m.hh!==r.hh)m.san=clamp(m.san-(has(m,'bochap')?2:4),0,100)});

}
function handover(r){if(!r.leader)return;r.leader=false;const nl=best('K',known().filter(x=>x.alive&&x.age>=16));if(nl){nl.leader=true;log(nl.name+' steps up to lead the block.','big');queue('info',{i:'⭐',t:'A new leader',x:'With '+r.name+' gone, the block turns to '+nl.name+'. You play on as them.',bad:1})}}
function vacate(h){if(h&&!members(h).length&&h.unit){const u=U(h.unit);if(u&&u.st==='known'){u.st='empty';u.hh=null;u.looted=false}}}
function exile(r,cause){
  r.alive=false;r.away=false;r.job='rest';if(r.wpn){itemAdd(S.items,r.wpn);r.wpn=null}if(r.arm){itemAdd(S.items,r.arm);r.arm=null}
  S.mem.unshift({name:r.name,age:r.age,arch:ARCH[r.arch].l,cause,when:stamp(S.t)+' '+PH[S.ph]});log(r.name+': '+cause+'.','bad');
  handover(r);vacate(H(r.hh));
}
function checkOver(){
  if(S.over)return;
  if(!known().length){S.over=true;S.overWhy='Nobody left in the block.'}
}

/* ================= expeditions ================= */
function routes(dest){
  const out=[];
  if(S.front===0)out.push({k:'gate',n:'Walk out through the void deck',m:1,max:4});
  else{
    if(S.ph>=2)out.push({k:'sneak',n:'Sneak down the stairs in the dark',m:1.5+.15*S.front,max:3});
    if(S.built.rope&&S.front<=3)out.push({k:'rope',n:'Climb down the bedsheet rope',m:1.25,max:3});
    if(S.built.fox&&dest==='market')out.push({k:'fox',n:'Ride the flying fox',m:.8,max:2});
  }
  return out;
}
function lookouts(){return jobbers('lookout')}
function expRisk(dest,route,team,lure){
  if(!isOut())return 0;
  let r=DEST[dest].risk*(1+Math.sqrt(pday())*.13)*route.m;
  const w=S.weather.type;if(w==='rain'||w==='storm')r*=.8;if(w==='haze')r*=.85;
  if(S.ph===3&&route.k!=='sneak')r*=1.3;
  r*=Math.max(.55,1-lookouts().length*(route.k==='sneak'?.12:.06));
  r*=Math.max(.55,1-team.reduce((a,x)=>a+atkOf(x),0)*.04);
  if(lure)r*=.6;
  return clamp(r,.02,.9);
}
function riskLabel(r){if(r===0)return['None yet','goodline'];if(r<.08)return['Low','goodline'];if(r<.18)return['Moderate','warnline'];if(r<.3)return['High','badline'];return['Deadly','badline']}
function dispatch(dest){
  const rt=routes(dest).find(x=>x.k===(document.getElementById('route')||{}).value)||routes(dest)[0];
  const team=UI.team.map(RS).filter(r=>r&&able(r));
  if(!rt||!team.length)return;
  if(team.length>rt.max){flash('This route takes at most '+rt.max+' people.');return}
  const lureBox=document.getElementById('uselure');const lure=!!(lureBox&&lureBox.checked&&S.built.lure>0);if(lure)S.built.lure--;
  team.forEach(r=>{r.away=true});
  S.exps.push({dest,route:rt.k,rm:rt.m,team:team.map(r=>r.id),back:tick()+DEST[dest].dur,lure,from:S.ph});
  S.stats.runs++;
  log(team.map(r=>r.short).join(', ')+' set out for the '+DEST[dest].n.toLowerCase()+'.','');
  UI.team=[];save();render();
}
function resolveExps(){
  const done=S.exps.filter(e=>e.back<=tick());S.exps=S.exps.filter(e=>e.back>tick());
  done.forEach(e=>{
    if(e.wander||e.camp){returnLoner(e);return}
    const team=e.team.map(RS).filter(Boolean);const route={k:e.route,m:e.rm};
    const risk=expRisk(e.dest,route,team,e.lure);const lines=[];const loot={food:0,water:0,meds:0,scrap:0,items:{}};
    const survivors=[];
    team.forEach(r=>{
      r.away=false;if(!r.alive)return;
      const rr=clamp(risk*(1-(r.st.A-5)*.05)-defOf(r)*.03,0,.95);const x=R();

      if(x<rr){const d=ri(15,45);r.hp-=d;if(r.hp<=0){kill(r,'Died of wounds after a supply run');lines.push('💀 '+r.short+' made it back but died of wounds.');return}
        lines.push('🩸 '+r.short+' was hurt (−'+d+' HP).');if(chance(.4-defOf(r)*.07))infect(r,'a bite on the run')}
      survivors.push(r);
    });
    const cap=e.route==='fox'?.6:1;
    survivors.forEach(r=>{
      const drv=r.arch==='driver'?1.3:1;
      if(e.dest==='market'){const sf=S.market/100;const f=Math.round((6+ri(0,7))*sf*cap*drv*(isOut()?1:1.4));loot.food+=f;loot.water+=Math.round(ri(2,6)*Math.max(.3,sf)*cap);S.market=Math.max(0,S.market-f*.4);if(chance(.3))itemAdd(loot.items,pick(['battery','tape','rope','pail','clock','wire','sheets']))}
      if(e.dest==='hawker'){loot.food+=Math.round(ri(3,8)*Math.max(.25,1-(S.flags.hawkerRuns||0)*.06)*cap);S.flags.hawkerRuns=(S.flags.hawkerRuns||0)+1;if(chance(.3))itemAdd(loot.items,pick(['wok','pot','knife','pail']));loot.scrap+=ri(0,2)}
      if(e.dest==='park'){r.san=clamp(r.san+ri(18,30),0,100);loot.food+=ri(0,3);if(chance(.45))itemAdd(loot.items,pick(['bamboo','rope','tarp','changkol','pail','pipe']))}
      if(e.dest==='school'){for(let i=0;i<ri(1,2);i++)itemAdd(loot.items,pick(['pipe','tape','rope','sheets','extinguisher','wire','pail','tarp','clock']));loot.meds+=ri(0,1);loot.food+=ri(0,4);loot.scrap+=ri(1,4)}
      if(e.dest==='police'){if(chance(.5))itemAdd(loot.items,'baton');if(chance(.3))itemAdd(loot.items,'riot');if(chance(.25))itemAdd(loot.items,'helmet');if(chance(.15)&&!S.items.radio&&!loot.items.radio)itemAdd(loot.items,'radio');loot.meds+=ri(0,2);loot.scrap+=ri(0,2)}
    });
    if(e.dest==='park'&&survivors.length)lines.push('🌳 Sunlight and open sky. The team feels human again.');
    S.store.food+=loot.food;S.store.water+=loot.water;S.store.meds+=loot.meds;S.store.scrap+=loot.scrap;
    for(const k in loot.items)itemAdd(S.items,k,loot.items[k]);
    const got=[];if(loot.food)got.push(loot.food+' food');if(loot.water)got.push(loot.water+' water');if(loot.meds)got.push(loot.meds+' meds');if(loot.scrap)got.push(loot.scrap+' scrap');for(const k in loot.items)got.push(loot.items[k]+'× '+ITEMS[k]);
    if(got.length)lines.push('Brought back: '+got.join(', ')+'.');else if(survivors.length)lines.push('They came back empty-handed.');

  });
}

/* ================= inventor ================= */
function hasNeeds(rc){for(const k in rc.need)if((S.items[k]||0)<rc.need[k])return false;return true}
function startProj(id){

function experiment(){
  const sel=UI.expSel.slice().sort();if(sel.length<2)return;
  if(S.flags.expT===tick()){flash('The inventor already tried something this phase.');return}
  const inv=known().some(r=>act(r)&&has(r,'inventor'));if(!inv){flash('You need a free resident with the Inventor trait.');return}

function newHousehold(eth){const h=mkHH(eth);h.known=true;h.kind='family';h.trust=60;S.hh.push(h);return h}
function reveal(u,msg){const h=H(u.hh);if(!h)return;h.known=true;u.st='known';log('Contact: the '+h.name+' at '+u.id+'. '+(msg||''),'good')}

function maybeEvent(){
  if(S.over)return;
  if(!chance(isOut()?.32:.38))return;
  const opts=REV.filter(e=>(S.evcd[e.id]||-99)<S.t-2&&e.c());if(!opts.length)return;
  const tot=opts.reduce((a,e)=>a+e.w,0);let x=R()*tot;let ev=opts[0];for(const e of opts){x-=e.w;if(x<=0){ev=e;break}}
  S.evcd[ev.id]=S.t;queue('r:'+ev.id,{});
}
function buildCard(q){
  try{return buildCard0(q)}catch(e){console.error(e);return null}
}
function buildCard0(q){
  if(q.id.startsWith('r:')){const e=REV.find(x=>x.id===q.id.slice(2));return e?e.make():null}
  return EV[q.id]?EV[q.id].make(q.a):null;
}

/* ================= player actions ================= */
function flash(t){UI.flash=t;render();setTimeout(()=>{if(UI.flash===t){UI.flash=null;render()}},2600)}
function chat(uid){
  const u=U(uid);if(!u||u.st!=='unknown'||!S.grid.telco||S.chatUsed[uid])return;S.chatUsed[uid]=1;
  const h=u.hh?H(u.hh):null;
  if(!h||h.fate){log('No reply from '+u.id+' on the block chat.','');flash('No reply from '+u.id+'. Try again tomorrow, or knock.')}
  else if(chance(h.kind==='wary'?.3:.65)){reveal(u,'They replied on the chat.')}
  else{log('Message to '+u.id+' read, but no reply.','');flash('Seen, no reply. Try again tomorrow.')}
  save();render();
}
function knock(uid){
  const u=U(uid);const r=RS(+document.getElementById('worker').value);if(!u||!r||!able(r)||u.st!=='unknown')return;r.busy=true;
  const h=u.hh?H(u.hh):null;let msg;
  if(!h){u.st='empty';msg='Nobody home. The gate is unlocked. '+u.id+' is empty and can be searched or put to use.'}
  else if(h.fate==='dead'){u.st='empty';u.hh=null;r.san=clamp(r.san-12,0,100);msg='The smell hits first. Nobody in '+u.id+' is alive. '+r.short+' closes the door and sits on the stairs for a long time. The flat can be used now.'}
  else if(h.fate==='turned'){
    const def=defOf(r),atk=atkOf(r);
    if(chance(.45-atk*.06-def*.05)){const d=ri(15,35);r.hp-=d;u.st='danger';if(r.hp<=0){kill(r,'Attacked knocking on '+u.id);msg='The gate burst open. '+r.short+' was killed.'}else{msg='The door bursts open. What used to be the '+h.name+' grabs '+r.short+'. They get away, hurt (−'+d+' HP). '+u.id+' is marked dangerous.';if(chance(.45-def*.08))infect(r,'a bite from a neighbour')}}
    else{u.st='danger';msg='Behind the gate, groaning and scratching. '+r.short+' backs away carefully. '+u.id+' is marked dangerous.'}
  }else{
    if(h.kind==='wary'&&r.st.K*10+ri(0,30)<60){msg='"Go away! We are fine!" The '+h.name+' won\'t open up. Someone with more Kampung spirit might do better.'}
    else{reveal(u,'');msg='The '+h.name+' open the gate. '+members(h).length+' people, '+(h.food>members(h).length*3?'decently stocked':'running low on food')+'. They join the block.'}
  }
  log(r.short+' knocked on '+u.id+'. '+msg,'');
  queue('info',{i:'🚪',t:'Knocking on '+u.id,x:msg});save();render();
}
function search(uid){
  const u=U(uid);const r=RS(+document.getElementById('worker').value);if(!u||!r||!able(r)||u.st!=='empty'||u.looted)return;r.busy=true;u.looted=true;
  const f=ri(0,6),sc=ri(2,6);S.store.food+=f;S.store.scrap+=sc;const it=[];for(let i=0;i<ri(1,2);i++){const k=wpick(HH_ITEMS);itemAdd(S.items,k);it.push(ITEMS[k])}
  if(chance(.25))S.store.meds++;
  const msg=r.short+' searched '+u.id+': '+f+' food, '+sc+' scrap, '+it.join(', ')+'.';log(msg,'good');flash(msg);save();render();
}
function convert(uid){const u=U(uid);const k=document.getElementById('roomsel').value;const rm=ROOMS[k];if(!u||u.st!=='empty'||!rm||S.store.scrap<rm.cost)return;S.store.scrap-=rm.cost;u.room=k;log(u.id+' converted into a '+rm.n.toLowerCase()+'.','good');save();render()}
function moveIn(uid){const u=U(uid);const h=H(+document.getElementById('hhsel').value);if(!u||!h||u.st!=='empty'||u.room)return;if(h.unit){const old=U(h.unit);if(old){old.st='empty';old.hh=null;old.looted=true}}h.unit=u.id;u.hh=h.id;u.st='known';log('The '+h.name+' moved into '+u.id+'.','');save();render()}
function seal(uid){const u=U(uid);if(!u||u.st!=='danger'||S.store.scrap<5)return;S.store.scrap-=5;u.st='sealed';log(u.id+' sealed shut with planks and wire.','');save();render()}
function clearUnit(uid){
  const u=U(uid);if(!u||!(u.st==='danger'||u.st==='sealed'))return;
  const team=known().filter(able).sort((a,b)=>guardPow(b)-guardPow(a)).slice(0,2);if(team.length<2)return;
  const T=team.reduce((a,r)=>a+guardPow(r),0);const P=6+pday()*.15;const win=chance(T/(T+P));const out=[];
  team.forEach(r=>{r.busy=true;if(chance(win?.2:.5)){const d=ri(10,30);r.hp-=d;if(r.hp<=0){kill(r,'Killed clearing '+u.id);out.push(r.short+' was killed.')}else{out.push(r.short+' was hurt.');if(chance(.35-defOf(r)*.07))infect(r,'a bite clearing '+u.id)}}});
  if(win){u.st='empty';u.hh=null;u.looted=false;out.unshift(team.map(r=>r.short).join(' and ')+' cleared '+u.id+'. The flat is empty now.')}else out.unshift('They were driven back from '+u.id+'.');
  log(out.join(' '),win?'good':'bad');queue('info',{i:'⚔️',t:'Clearing '+u.id,x:out.join('\n'),bad:!win});save();render();
}
function donate(hid,k){
  const h=H(hid);if(!h||!h.items[k])return;const ms=members(h);
  let p=.35+h.trust/150;if(ms.some(r=>has(r,'atas')))p-=.25;if(ms.some(r=>has(r,'kiasu')))p-=.12;if(isOut())p+=.1;
  if(S.flags['ask'+hid]===tick()){flash('You already asked the '+h.name+' this phase.');return}S.flags['ask'+hid]=tick();
  if(chance(p)){itemAdd(h.items,k,-1);itemAdd(S.items,k);h.trust=clamp(h.trust+2,0,100);log('The '+h.name+' donated their '+ITEMS[k].toLowerCase()+'.','good');flash('The '+h.name+' hand over their '+ITEMS[k].toLowerCase()+'.')}
  else{h.trust=clamp(h.trust-2,0,100);flash('"Aiyah, we might need it leh." The '+h.name+' say no. Try again later.')}
  save();render();
}
function moveFood(hid,dir,kind){
  const h=H(hid);if(!h)return;kind=kind||'food';
  if(dir==='in'){const n=Math.min(5,h[kind]);if(!n)return;const ms=members(h);let p=.4+h.trust/150;if(ms.some(r=>has(r,'kiasu')))p-=.2;if(S.flags['askf'+hid]===tick()){flash('Already asked this phase.');return}S.flags['askf'+hid]=tick();if(chance(p)){h[kind]-=n;S.store[kind]+=n;flash('The '+h.name+' share '+n+' '+kind+'.')}else{h.trust=clamp(h.trust-3,0,100);flash('The '+h.name+' refuse to share.')}}
  else{const n=Math.min(5,S.store[kind]);if(!n)return;S.store[kind]-=n;h[kind]+=n;h.trust=clamp(h.trust+3,0,100)}
  save();render();
}
function talkTo(id){const r=RS(id);if(!r||S.talks<=0)return;const t=best('K',known().filter(m=>act(m)&&m!==r&&m.age>=16))||leader();S.talks--;const g=Math.round(6+(t?t.st.K*1.6:5)+ri(0,6));r.san=clamp(r.san+g,0,100);flash((t?t.short:'Someone')+' spends time with '+r.short+'. Sanity +'+g+'.');save();render()}
function setJob(id,j){const r=RS(id);if(!r)return;r.job=j;save();render()}
function equip(id,slot,k){const r=RS(id);if(!r)return;const cur=r[slot];if(cur)itemAdd(S.items,cur);r[slot]=null;if(k&&S.items[k]){itemAdd(S.items,k,-1);r[slot]=k}save();render()}
function armGuards(){
  const g=jobbers('guard').concat(jobbers('lookout')).sort((a,b)=>b.st.S-a.st.S);if(!g.length)return;
  ['wpn','arm'].forEach(slot=>{
    g.forEach(r=>{if(r[slot]){itemAdd(S.items,r[slot]);r[slot]=null}});
    const val=k=>slot==='wpn'?GEAR[k].atk||0:GEAR[k].def||0;
    const pool=[];for(const k in S.items)if(GEAR[k]&&val(k)>0)for(let i=0;i<S.items[k];i++)pool.push(k);
    pool.sort((a,b)=>val(b)-val(a));
    g.forEach(r=>{const k=pool.shift();if(k){itemAdd(S.items,k,-1);r[slot]=k}});
  });
  const armed=g.filter(r=>r.wpn).length;flash(armed+' of '+g.length+' guards and lookouts have weapons.');save();render();
}
function reinforce(){if(S.store.scrap<5||!isOut())return;S.store.scrap-=5;S.bar.hp=Math.min(S.bar.max,S.bar.hp+20);log('Line reinforced (+20).','');save();render()}
function strip(l){if(S.flags['strip'+l]||l<=S.front)return;S.flags['strip'+l]=1;const sc=ri(3,7);S.store.scrap+=sc;log('Stripped the floor '+pad(l)+' corridor: shoe racks, potted plants, a bicycle. +'+sc+' scrap.','');save();render()}
function throwLure(){if(!S.built.lure||!isOut())return;S.built.lure--;S.flags.lure=1;log('A noise lure is set for tonight.','');save();render()}
function retake(){
  if(S.front<1)return;const g=jobbers('guard');if(g.length<3)return;
  const T=g.reduce((a,r)=>a+guardPow(r),0);const P=basePressure()*1.6+8;const win=chance(T/(T+P));const out=[];
  g.forEach(r=>{r.busy=true;if(chance(win?.2:.45)){const d=ri(12,35);r.hp-=d;if(r.hp<=0){kill(r,'Killed retaking floor '+pad(S.front));out.push(r.short+' was killed.')}else{out.push(r.short+' was hurt.');if(chance(.3-defOf(r)*.06))infect(r,'a bite while retaking a floor')}}});
  if(win){const l=S.front;S.front--;S.units.filter(u=>u.lvl===l).forEach(u=>{u.st='empty';u.hh=null;u.looted=false});S.bar={hp:35,max:60+S.built.kits*40};out.unshift(l===1?'The void deck is yours again.':'Floor '+pad(l)+' is retaken. Its flats are empty and can be searched.')}
  else{S.bar.hp-=10;out.unshift('The push failed. The guards fell back behind the barricade.');if(S.bar.hp<=0)levelFalls()}
  log(out[0],win?'big':'bad');queue('info',{i:'⚔️',t:win?'Floor retaken':'The push failed',x:out.join('\n'),bad:!win});save();render();
}

  const avg=ks.length?Math.round(ks.reduce((a,r)=>a+r.san,0)/ks.length):0;
  const dayTxt=isOut()?'Day '+pday():'Prep day '+(S.t+1);
  $('#hud').innerHTML=`<div class="hud-time"><b>${dayTxt}</b><span>${PH[S.ph]}</span><span class="mute small hud-date">${fmtDate(curDate())}</span>

  }else if(F==='inventor'){
    const inv=ks.filter(r=>has(r,'inventor'));h+=inv.length?sec('Inventors',inv,'Only residents with the Inventor trait make progress. Others on Workshop just help.'):'<p class="mute">No inventors yet. Reach more neighbours: some have the Inventor trait.</p>';
  }else if(F==='fighters'){
    h+=sec('Fit to fight',ks.filter(able).sort((a,b)=>guardPow(b)-guardPow(a)),'Sorted by fighting strength (⚔). Strength, weapon, health and traits like Garang all count.');
  }else{
    h+=ks.slice().sort(byFloor).map(personRow).join('');
  }
  return h;
}
function panelOutside(){
  const d=UI.dest;const rts=routes(d);const team=UI.team.map(RS).filter(r=>r&&able(r));
  let h=`<h2>Outside</h2><div class="stack">`;
  h+=Object.entries(DEST).map(([k,x])=>`<button class="dest card ${k===d?'on':''}" data-act="dest" data-v="${k}"><span class="e">${x.e}</span><span><b>${x.n}</b><br><span class="small mute">${x.d}${k==='market'?' Stock: '+Math.round(S.market)+'%.':''}</span></span></button>`).join('');
  h+=`</div><h3>Plan a run: ${DEST[d].n}</h3>`;
  if(!rts.length)h+=`<p class="warnline">The void deck is lost. You can only sneak down the stairs in the evening or at night, or build a bedsheet rope or flying fox in the Workshop.</p>`;
  else{
    h+=`<label class="small mute" for="route">Route</label><select id="route" style="width:100%;margin-bottom:8px">${rts.map(r=>`<option value="${r.k}">${r.n} (max ${r.max})</option>`).join('')}</select>`;
    const rt=rts[0];const rk=expRisk(d,rt,team,false);const lb=riskLabel(rk);
    h+=`<p class="${lb[1]}">Risk per person: ${lb[0]}${isOut()?' (~'+Math.round(rk*100)+'%)':' (no zombies yet)'}. Lookouts on the roof: ${lookouts().length}.</p>`;
    if(S.built.lure)h+=`<label class="teamrow"><input type="checkbox" id="uselure"> Throw a noise lure first (${S.built.lure} left)</label>`;
    const cands=known().filter(able);
    h+=`<div class="card">${cands.length?cands.map(r=>`<label class="teamrow"><input type="checkbox" data-chg="team" data-id="${r.id}" ${UI.team.includes(r.id)?'checked':''}> ${faceOf(r)} ${esc(r.short)} <span class="mute small">Agi ${r.st.A} · Str ${r.st.S} · HP ${Math.round(r.hp)}${r.wpn?' · '+ITEMS[r.wpn]:''}${r.arm?' · '+ITEMS[r.arm]:''}</span></label>`).join(''):'<span class="mute">Nobody is fit to go.</span>'}</div>`;
    h+=`<div class="row" style="margin-top:8px"><button class="btn-main" data-act="dispatch" data-v="${d}" ${team.length?'':'disabled'}>Send ${team.length||''} ${team.length===1?'person':'people'}</button><span class="small mute">Back ${DEST[d].dur===1?'next phase':'in two phases'}.</span></div>`;
  }
  const out=S.exps.filter(e=>DEST[e.dest]);
  if(out.length)h+=`<h3>Out now</h3>`+out.map(e=>`<div class="small">${DEST[e.dest].e} ${e.team.map(id=>esc(RS(id).short)).join(', ')}, back ${e.back-tick()<=1?'next phase':'in '+(e.back-tick())+' phases'}</div>`).join('');
  return h;
}
function panelWorkshop(){
  const inv=known().filter(r=>has(r,'inventor'));
  let h=`<h2>Workshop</h2><p class="small mute">Inventors: ${inv.length?inv.map(r=>esc(r.short)+(r.job==='invent'?' (working)':' (not assigned)')).join(', '):'none yet. Look for neighbours with the Inventor trait.'}${rooms('workshop')?' · Workshop room: +50%':''}</p>`;
  if(S.proj){const rc=RECIPES.find(r=>r.id===S.proj.id);h+=`<div class="card"><b>Building: ${rc.n}</b>${bar(S.proj.prog/S.proj.work*100,'var(--lamp)')}<span class="small mute">${Math.floor(S.proj.prog)}/${S.proj.work} work.</span>${jobbers('invent').some(r=>has(r,'inventor'))?`<span class="small goodline"> ${jobbers('invent').filter(r=>has(r,'inventor')).map(r=>esc(r.short)).join(', ')} working on it.</span>`:`<div class="badline" style="margin-top:4px">Nobody is working on it. An inventor's job must be set to Workshop.</div>`}<div class="row" style="margin-top:8px">${inv.some(r=>able(r)&&r.job!=='invent')?`<button class="btn-main" data-act="invwork">Put free inventors to work</button>`:''}<button data-act="cancelproj">Cancel (items returned)</button></div></div>`}
  h+=`<h3>Communal items</h3>`;
  const it=Object.keys(S.items);
  h+=it.length?`<div class="itemchips">${it.map(k=>`<button class="ic ${UI.expSel.includes(k)?'on':''}" data-act="expsel" data-v="${k}">${ITEMS[k]} ×${S.items[k]}</button>`).join('')}</div>`:'<p class="mute small">Empty. Ask households to donate items from their flats.</p>';
  h+=`<div class="row" style="margin-top:8px"><button data-act="experiment" ${UI.expSel.length>=2?'':'disabled'}>💡 Try combining ${UI.expSel.length?UI.expSel.map(k=>ITEMS[k]).join(' + '):'selected items'}</button></div><p class="small mute">Pick 2 or 3 items and let the inventor experiment. Items are not used up.</p>`;
  h+=`<h3>Blueprints</h3><div class="stack">`+RECIPES.map(rc=>{
    if(!S.known[rc.id])return `<div class="card"><b class="mute">??? Unknown idea</b><br><span class="small mute">Hint: ${rc.hint}</span></div>`;
    const need=Object.entries(rc.need).map(([k,n])=>`<span class="${(S.items[k]||0)>=n?'goodline':'badline'}">${n}× ${ITEMS[k]}</span>`).join(' + ');
    const done=(rc.id==='flyingFox'&&S.built.fox)||(rc.id==='sheetRope'&&S.built.rope);
    return `<div class="card stack" style="gap:4px"><b>${rc.n}</b><span class="small mute">${rc.d}</span><span class="small">${need} · ${rc.work} work</span><div class="row"><button data-act="build" data-v="${rc.id}" ${!S.proj&&hasNeeds(rc)&&!done?'':'disabled'}>${done?'Built':'Build'}</button>${done?'':S.proj?'<span class="small mute">Workshop busy. One project at a time.</span>':!hasNeeds(rc)?'<span class="small mute">Missing items (in red).</span>':''}</div></div>`}).join('')+`</div>`;
  return h;
}
function panelBlock(){
  let h=`<h2>Blk ${esc(S.blk)}</h2>`;
  h+=`<div class="kv"><span class="mute">Line</span><span>${S.front===0?'Void deck shutter':'Floor '+pad(S.front+1)+' stairwell'} · ${Math.max(0,Math.round(S.bar.hp))}/${S.bar.max}</span>
  <span class="mute">Guards</span><span>${jobbers('guard').length}</span><span class="mute">Lookouts</span><span>${lookouts().length}</span>
  <span class="mute">Power</span><span>${S.grid.power?'On':'Off'}</span><span class="mute">Taps</span><span>${S.grid.water?'Running':'Dry'}</span><span class="mute">Phones</span><span>${S.grid.telco?'Working':'Dead'}</span>
  <span class="mute">Lures</span><span>${S.built.lure}</span><span class="mute">Lamps</span><span>${S.built.lamp}</span></div>`;
  h+=`<h3>Rations from the communal store</h3><div class="row">${['full','half','none'].map(v=>`<button class="${S.ration===v?'btn-main':''}" data-act="ration" data-v="${v}">${{full:'Full',half:'Half',none:'None'}[v]}</button>`).join('')}</div><p class="small mute">Households eat their own food first. When it runs out, the store tops them up at this level.</p>`;
  h+=`<h3>Defence</h3><div class="stack">
    <button data-act="reinforce" ${S.store.scrap>=5&&isOut()?'':'disabled'}>🔩 Reinforce the line (−5 scrap, +20)</button>
    <button data-act="lure" ${S.built.lure&&isOut()&&!S.flags.lure?'':'disabled'}>⏰ Throw a noise lure tonight (${S.built.lure})</button>
    ${S.front>0?`<button class="btn-bad" data-act="retake" ${jobbers('guard').length>=3?'':'disabled'}>⚔️ Push down and retake ${S.front===1?'the void deck':'floor '+pad(S.front)} (all guards, needs 3+)</button>`:''}
  </div>`;
  const strippable=[];for(let l=S.front+1;l<=S.floors;l++)if(l>=2&&!S.flags['strip'+l])strippable.push(l);
  h+=`<h3>Scrap</h3><p class="small mute">Strip a corridor of shoe racks, plants and bicycles for barricade material.</p><div class="row">${strippable.slice(0,8).map(l=>`<button data-act="strip" data-v="${l}">Floor ${pad(l)}</button>`).join('')||'<span class="mute small">Nothing left to strip.</span>'}</div>`;
  h+=`<h3>Memorial</h3>`+(S.mem.length?S.mem.map(m=>`<div class="logl"><span class="mono">${m.when}</span>${esc(m.name)}, ${m.age}. <span class="mute">${esc(m.cause)}.</span></div>`).join(''):'<p class="mute small">No one yet.</p>');
  h+=`<h3>Game</h3><button data-act="quit">Abandon this block and start over</button>`;
  return h;
}
function panelLog(){return '<h2>Log</h2>'+S.log.map(l=>`<div class="logl log-${l.kind}"><span class="mono">${stamp(l.t)} ${PH[l.ph].slice(0,3)}</span>${esc(l.text)}</div>`).join('')}
function renderModal(){
  const m=$('#modal');
  if(S.over){m.hidden=false;const days=isOut()?pday():0;m.innerHTML=`<div class="ev bad"><div class="ico">🪦</div><h2>Blk ${esc(S.blk)} has fallen</h2><p>${esc(S.overWhy||'')}\n\nYou held out for ${days} day${days===1?'':'s'} after the outbreak. ${S.mem.length} people are remembered.</p><div class="stack small" style="max-height:200px;overflow:auto;margin-bottom:12px">${S.mem.map(x=>`<div>${esc(x.name)}, ${x.age}: <span class="mute">${esc(x.cause)}</span></div>`).join('')}</div><div class="choices"><button class="btn-main" data-act="quit">New game</button></div></div>`;return}
  if(UI.result){m.hidden=false;m.innerHTML=`<div class="ev"><p>${esc(UI.result)}</p><div class="choices"><button class="btn-main" data-act="ok">OK</button></div></div>`;return}
  while(S.queue.length&&!CUR){const q=S.queue[0];const c=buildCard(q);if(c){CUR=c;break}S.queue.shift()}
  if(!CUR){m.hidden=true;m.innerHTML='';return}
  m.hidden=false;
  m.innerHTML=`<div class="ev ${CUR.bad?'bad':''} ${CUR.zed?'zed':''}"><div class="ico">${CUR.i}</div><h2>${esc(CUR.t)}</h2><p>${esc(CUR.x)}</p><div class="choices">${CUR.c.map((c,i)=>`<button data-act="choice" data-v="${i}" ${c.dis?'disabled':''}>${esc(c.t)}${c.s?`<small>${esc(c.s)}</small>`:''}</button>`).join('')}</div></div>`;
}
function choose(i){
  const c=CUR&&CUR.c[i];if(!c||c.dis)return;
  S.queue.shift();CUR=null;const res=c.f();
  if(res)UI.result=res;
  checkOver();save();render();
}

/* ================= input ================= */
const ACT={
  start:d=>{newGame(d.v);save();render()},
  continue:()=>{S=loadSave();migrate();CUR=null;render()},
  next:()=>advance(),
  sel:d=>{UI.sel=d.v;UI.tab='unit';render()},
  selres:d=>{const r=RS(+d.v);const u=unitOf(r);if(u){UI.sel=u.id;UI.tab='unit';render()}},
  tab:d=>{UI.tab=d.v;render()},
  site:d=>{UI.dest=d.v;UI.tab='outside';render()},
  dest:d=>{UI.dest=d.v;render()},
  chat:d=>chat(d.v),knock:d=>knock(d.v),search:d=>search(d.v),convert:d=>convert(d.v),movein:d=>moveIn(d.v),seal:d=>seal(d.v),clear:d=>clearUnit(d.v),
  donate:d=>donate(+d.v,d.k),askfood:d=>moveFood(+d.v,'in'),givefood:d=>moveFood(+d.v,'out'),givewater:d=>moveFood(+d.v,'out','water'),
  talk:d=>talkTo(+d.v),release:d=>{const r=RS(+d.v);if(r){r.quar=false;save();render()}},
  dispatch:d=>dispatch(d.v),
  build:d=>startProj(d.v),
  pf:d=>{UI.pf=d.v;render()},
  armguards:()=>armGuards(),
  invwork:()=>{known().filter(r=>able(r)&&has(r,'inventor')).forEach(r=>r.job='invent');save();render()},
  cancelproj:()=>{if(!S.proj)return;const rc=RECIPES.find(r=>r.id===S.proj.id);for(const k in rc.need)itemAdd(S.items,k,rc.need[k]);log('Workshop project cancelled: '+rc.n+'.','');S.proj=null;save();render()},expsel:d=>{const i=UI.expSel.indexOf(d.v);if(i>=0)UI.expSel.splice(i,1);else if(UI.expSel.length<3)UI.expSel.push(d.v);render()},experiment:()=>experiment(),
  ration:d=>{S.ration=d.v;save();render()},reinforce:()=>reinforce(),lure:()=>throwLure(),retake:()=>retake(),strip:d=>strip(+d.v),
  choice:d=>choose(+d.v),ok:()=>{UI.result=null;render()},
  quit:()=>{if(!S.over&&!UI.confirmQuit){UI.confirmQuit=1;flash('Press again to abandon this block.');setTimeout(()=>UI.confirmQuit=0,3000);return}UI.confirmQuit=0;wipe();S=null;CUR=null;UI.result=null;render()},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;if(b.tagName==='A')e.preventDefault();const f=ACT[b.dataset.act];if(f)f(b.dataset)});
document.addEventListener('change',e=>{const el=e.target;const k=el.dataset&&el.dataset.chg;if(!k)return;const id=+el.dataset.id;
  if(k==='job')setJob(id,el.value);
  if(k==='wpn')equip(id,'wpn',el.value);
  if(k==='arm')equip(id,'arm',el.value);
  if(k==='team'){const i=UI.team.indexOf(id);if(el.checked&&i<0)UI.team.push(id);if(!el.checked&&i>=0)UI.team.splice(i,1);const keep=document.getElementById('route')?document.getElementById('route').value:null;render();if(keep&&document.getElementById('route'))document.getElementById('route').value=keep}
});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&S&&!e.target.closest('select,input,button')){e.preventDefault();if(!$('#modal').hidden){const b=$('#modal .choices button:not(:disabled)');if(b&&(UI.result||S.over))b.click();return}advance()}});

function migrate(){
  if(!S)return;
  S.res.forEach(r=>{if(r.short==='You'){const n=r.name.replace(' (you)','');const h=H(r.hh);r.short=h&&h.eth==='cn'?n.split(' ').slice(1).join(' '):n.split(' ')[0]}});
}
function start(data){
  if(data&&data.S){S=data.S;Object.assign(UI,data.UI||{});migrate()}
  render();
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S,UI}));
(window.claude&&window.claude.hot&&window.claude.hot.ready)?window.claude.hot.ready(start):start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>
